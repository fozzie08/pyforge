<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PyForge</title>
<meta name="description" content="Learn Python with runnable lessons, practice exercises and LeetCode-style challenges that run right in your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;700&family=Schibsted+Grotesk:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="assets/codemirror.css">
<link rel="stylesheet" href="assets/styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js" integrity="sha384-ZYmwuq4n2gOcNxMSiJ6jyTj+BbIrilr7p6dlq6q5nmSWKmsH9UU4K1qqjycMkfmR" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js" integrity="sha384-Xy+2exU6lBoT4OpUOtnQb+cUpn+nlJQEHvRobWVtwz6wIsw4oNoO7xyd/l8rYgMy" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js" integrity="sha384-LjCI3E8qhhxXZvu7+FCvqx9eZYSowFvuJ7z54KsgI/BDPGKEuysqCg/vYiKHvC4Y" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js" integrity="sha384-69mJoUoPPF/C7qPs6lLjvXvrt6w225+rmxWqGO3a1glVjITdnnwPQOtG9FRTd2Ni" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/comment/comment.min.js" integrity="sha384-B6Af6BES5glvxvAPc9Vrl9t1lHx1k3iL8AcT1XmsmlEVZudSW8E+8CA1TxVbdQbj" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/runmode/runmode.min.js" integrity="sha384-/cmd3Km1T/tqET+aLxnD1Mm39cKeLo/PJND23EE1dPX1iF7ukaPcMvD0aX2gBS6d" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <a class="brand" href="#/" aria-label="PyForge home">
      <span class="brand-prompt" aria-hidden="true">&gt;&gt;&gt;</span>
      <span class="brand-name">PyForge</span>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="#/" data-nav="learn">Learn</a>
      <a href="#/problems" data-nav="problems">Problems</a>
      <a href="#/progress" data-nav="progress">Progress</a>
    </nav>
    <div class="topbar-right">
      <span class="runtime-pill" id="runtime-pill" data-state="idle" title="Python runs in your browser using Pyodide">
        <span class="dot"></span><span class="label">Python idle</span>
      </span>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/></svg>
      </button>
    </div>
  </header>
  <main id="app" tabindex="-1"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="assets/content.js"></script>
<script src="assets/markdown.js"></script>
<script src="assets/runner.js"></script>
<script src="assets/app.js"></script>
</body>
</html>

","checker":null,"time_limit_ms":2000,"examples":[{"args":["[10, 15, 20]"],"expected":"15","why":"Start on stair 1, pay 15, and climb two stairs to the top."},{"args":["[1, 100, 1, 1, 1, 100, 1, 1, 100, 1]"],"expected":"6","why":null}],"tests":[{"args":["[0, 0]"],"expected":"0"},{"args":["[5, 10]"],"expected":"5"},{"args":["[1, 2, 3]"],"expected":"2"},{"args":["[0, 1, 2, 2]"],"expected":"2"},{"args":["rand_list(1000, 0, 999, seed=63)"],"expected":null}],"lesson":"dp-1d","module":"heaps-dp"},"paths-with-obstacles":{"id":"paths-with-obstacles","kind":"exercise","title":"Paths Around Obstacles","difficulty":"Practice","tags":[],"description":"A robot starts at the top-left of `grid` and wants to reach the bottom-right, moving only **right** or **down**. Cells containing `1` are obstacles, and `0` cells are free.\n\nReturn the number of distinct routes. If the start or the end is blocked, the answer is `0`.","constraints":["`1 <= rows, cols <= 100`","`grid[r][c]` is 0 or 1"],"hints":["Same recurrence as the lesson: paths into a cell come from above plus from the left.","An obstacle cell has 0 paths into it.","Careful with the first row and column: once blocked, everything after is unreachable."],"explanation":"`paths[r][c] = paths[r - 1][c] + paths[r][c - 1]`, except obstacles are forced to 0. Starting with a single 1 at the origin and treating out-of-grid cells as 0 handles the first row and column automatically, including blocked edges. Each row depends only on the row above, so one list updated in place is enough: `row[c]` still holds the value from above when we add `row[c - 1]`, which is the value from the left.\n\n**Complexity:** O(rows × cols) time, O(cols) space.","style":"function","entry":"paths_with_obstacles","params":[{"name":"grid","type":"List[List[int]]","kind":"plain"}],"return_type":"int","return_kind":"plain","starter":"def paths_with_obstacles(grid: List[List[int]]) -> int:\n    pass\n","compare":"exact","reference":"def paths_with_obstacles(grid: List[List[int]]) -> int:\n    cols = len(grid[0])\n    row = [0] * cols\n    row[0] = 1\n    for r in range(len(grid)):\n        for c in range(cols):\n            if grid[r][c] == 1:\n                row[c] = 0\n            elif c > 0:\n                row[c] += row[c - 1]\n    return row[-1]\n","checker":null,"time_limit_ms":2000,"examples":[{"args":["[[0, 0, 0], [0, 1, 0], [0, 0, 0]]"],"expected":"2","why":"Go around the centre obstacle either clockwise or anticlockwise."},{"args":["[[0, 1], [0, 0]]"],"expected":"1","why":null}],"tests":[{"args":["[[1]]"],"expected":"0"},{"args":["[[0]]"],"expected":"1"},{"args":["[[0, 0], [0, 1]]"],"expected":"0"},{"args":["[[0, 0, 0, 0]]"],"expected":"1"},{"args":["[[0], [1], [0]]"],"expected":"0"},{"args":["[[0, 0], [1, 0], [0, 0]]"],"expected":"1"},{"args":["[[0] * 60 for _ in range(60)]"],"expected":null},{"args":["rand_grid(80, 80, [0, 0, 0, 0, 0, 0, 0, 1], seed=64)"],"expected":null}],"lesson":"dp-2d","module":"heaps-dp"},"lcs-length":{"id":"lcs-length","kind":"exercise","title":"Longest Common Subsequence","difficulty":"Practice","tags":[],"description":"A **subsequence** keeps some characters of a string, in their original order, but not necessarily next to each other. For example, `\"ace\"` is a subsequence of `\"abcde\"`.\n\nReturn the length of the longest subsequence that `a` and `b` have in common.","constraints":["`1 <= len(a), len(b) <= 800`","Both strings contain lower-case English letters"],"hints":["Let `dp[i][j]` be the LCS length of `a[:i]` and `b[:j]`.","If `a[i - 1] == b[j - 1]`, that character extends the LCS of the shorter prefixes: `dp[i - 1][j - 1] + 1`.","Otherwise, drop the last character of one string or the other: `max(dp[i - 1][j], dp[i][j - 1])`."],"explanation":"`dp[i][j]` is the LCS of the prefixes `a[:i]` and `b[:j]`. A match extends the diagonal, `dp[i - 1][j - 1] + 1`. A mismatch means one of the two last characters isn't used, so take the better of skipping either one. Each row only reads the previous row, so two rows are enough.\n\n**Complexity:** O(m × n) time, O(n) space.","style":"function","entry":"lcs_length","params":[{"name":"a","type":"str","kind":"plain"},{"name":"b","type":"str","kind":"plain"}],"return_type":"int","return_kind":"plain","starter":"def lcs_length(a: str, b: str) -> int:\n    pass\n","compare":"exact","reference":"def lcs_length(a: str, b: str) -> int:\n    prev = [0] * (len(b) + 1)\n    for i in range(1, len(a) + 1):\n        cur = [0] * (len(b) + 1)\n        for j in range(1, len(b) + 1):\n            if a[i - 1] == b[j - 1]:\n                cur[j] = prev[j - 1] + 1\n            else:\n                cur[j] = max(prev[j], cur[j - 1])\n        prev = cur\n    return prev[-1]\n","checker":null,"time_limit_ms":2000,"examples":[{"args":["'abcde'","'ace'"],"expected":"3","why":"\"ace\" appears in both."},{"args":["'abc'","'abc'"],"expected":"3","why":null},{"args":["'abc'","'def'"],"expected":"0","why":null}],"tests":[{"args":["'a'","'a'"],"expected":"1"},{"args":["'bsbininm'","'jmjkbkjkv'"],"expected":"1"},{"args":["'oxcpqrsvwf'","'shmtulqrypy'"],"expected":"2"},{"args":["'ezupkr'","'ubmrapg'"],"expected":"2"},{"args":["'pythonista'","'typhoon'"],"expected":"4"},{"args":["rand_str(800, 'abcd', seed=65)","rand_str(800, 'abcd', seed=66)"],"expected":null}],"lesson":"dp-2d","module":"heaps-dp"},"neighbourhood-heist":{"id":"neighbourhood-heist","kind":"challenge","title":"Neighbourhood Heist","difficulty":"Medium","tags":["Dynamic Programming","Lists","Tuples"],"description":"A row of houses holds `nums[i]` in valuables each. Neighbouring houses share an alarm system, so taking from **two adjacent houses** on the same night triggers it.\n\nReturn the most you can collect without triggering an alarm.","constraints":["`1 <= len(nums) <= 10⁴`","`0 <= nums[i] <= 400`"],"hints":["At each house there are two choices: take it (so you skipped the previous one) or skip it.","Let `best[i]` be the most you can collect from the first `i` houses. How does it relate to `best[i - 1]` and `best[i - 2]`?","You only ever need the last two values."],"explanation":"`best[i] = max(best[i - 1], best[i - 2] + nums[i])`: either skip house `i`, or take it on top of the best haul that ends two houses back. The solution tracks this as two running values. `take` is the best total if the current house is robbed, and `skip` is the best if it isn't.\n\nTrying every subset is O(2ⁿ). Memoised recursion or tabulation brings it to linear time.\n\n**Complexity:** O(n) time, O(1) space.","style":"class","entry":"rob","params":[{"name":"nums","type":"List[int]","kind":"plain"}],"return_type":"int","return_kind":"plain","starter":"class Solution:\n    def rob(self, nums: List[int]) -> int:\n        pass\n","compare":"exact","reference":"class Solution:\n    def rob(self, nums: List[int]) -> int:\n        take, skip = 0, 0\n        for x in nums:\n            take, skip = skip + x, max(take, skip)\n        return max(take, skip)\n","checker":null,"time_limit_ms":2000,"examples":[{"args":["[1, 2, 3, 1]"],"expected":"4","why":"Take houses 0 and 2: 1 + 3 = 4."},{"args":["[2, 7, 9, 3, 1]"],"expected":"12","why":"Take houses 0, 2 and 4: 2 + 9 + 1 = 12."}],"tests":[{"args":["[5]"],"expected":"5"},{"args":["[2, 1, 1, 2]"],"expected":"4"},{"args":["[0, 0]"],"expected":"0"},{"args":["[100, 1, 1, 100]"],"expected":"200"},{"args":["[1, 3, 1]"],"expected":"3"},{"args":["rand_list(10**4, 0, 400, seed=71)"],"expected":null}],"module":"heaps-dp","number":27},"fewest-coins":{"id":"fewest-coins","kind":"challenge","title":"Fewest Coins","difficulty":"Medium","tags":["Dynamic Programming","Lists","Loops"],"description":"You have unlimited coins of each denomination in `coins`. Return the **fewest coins** needed to make exactly `amount`, or `-1` if it can't be done.","constraints":["`1 <= len(coins) <= 12`","`1 <= coins[i] <= 2³¹ - 1`","`0 <= amount <= 10⁴`"],"hints":["Greedy (always take the biggest coin) fails. Try coins `[1, 3, 4]` and amount 6.","Let `dp[s]` be the fewest coins that make `s`. The last coin used was some `c`, leaving `s - c`.","`dp[s] = 1 + min(dp[s - c])` over all coins `c <= s`, with `dp[0] = 0`."],"explanation":"Build `dp[s]`, the fewest coins that make `s`, for every `s` from 0 up to `amount`. The last coin used is some `c`, so `dp[s] = 1 + min(dp[s - c])`. Unreachable amounts stay at the sentinel `amount + 1`, which is more coins than any real answer could need. Going upward means each coin can be reused, matching the unlimited supply.\n\n**Complexity:** O(amount × len(coins)) time, O(amount) space.","style":"class","entry":"coinChange","params":[{"name":"coins","type":"List[int]","kind":"plain"},{"name":"amount","type":"int","kind":"plain"}],"return_type":"int","return_kind":"plain","starter":"class Solution:\n    def coinChange(self, coins: List[int], amount: int) -> int:\n        pass\n","compare":"exact","reference":"class Solution:\n    def coinChange(self, coins: List[int], amount: int) -> int:\n        INF = amount + 1\n        dp = [0] + [INF] * amount\n        for s in range(1, amount + 1):\n            for c in coins:\n                if c <= s and dp[s - c] + 1 < dp[s]:\n                    dp[s] = dp[s - c] + 1\n        return dp[amount] if dp[amount] != INF else -1\n","checker":null,"time_limit_ms":2000,"examples":[{"args":["[1, 2, 5]","11"],"expected":"3","why":"11 = 5 + 5 + 1"},{"args":["[2]","3"],"expected":"-1","why":null},{"args":["[1]","0"],"expected":"0","why":null}],"tests":[{"args":["[1]","1"],"expected":"1"},{"args":["[2, 5, 10, 1]","27"],"expected":"4"},{"args":["[186, 419, 83, 408]","6249"],"expected":"20"},{"args":["[3, 7]","5"],"expected":"-1"},{"args":["[1, 3, 4]","6"],"expected":"2"},{"args":["[5, 10]","3"],"expected":"-1"},{"args":["[1, 7, 23, 49]","10000"],"expected":"206"},{"args":["[7, 13, 29, 101, 257]","9999"],"expected":"47"}],"module":"heaps-dp","number":28},"closest-to-origin":{"id":"closest-to-origin","kind":"challenge","title":"Closest to the Origin","difficulty":"Medium","tags":["Heap","Sorting","Lambdas","Math"],"description":"Given a list of `points` on a plane, where each point is `[x, y]`, and an integer `k`, return the `k` points closest to the origin `(0, 0)` by straight-line (Euclidean) distance.\n\nThe answer is unique. Return the points in any order.","constraints":["`1 <= k <= len(points) <= 5 × 10⁴`","`-10⁴ <= x, y <= 10⁴`"],"hints":["You don't need the actual square root: comparing `x² + y²` gives the same order.","Sorting by distance with a `key` works in O(n log n).","A heap of size `k` (or `heapq.nsmallest`) does it in O(n log k)."],"explanation":"Rank points by squared distance `x² + y²`. The square root doesn't change the order, and skipping it avoids floating-point error. Then take the `k` smallest: `sorted(points, key=...)[:k]` is O(n log n), and `heapq.nsmallest(k, points, key=...)` keeps only `k` candidates, which is O(n log k). Quickselect gives O(n) on average.\n\n**Complexity:** O(n log k) time, O(k) extra space.","style":"class","entry":"kClosest","params":[{"name":"points","type":"List[List[int]]","kind":"plain"},{"name":"k","type":"int","kind":"plain"}],"return_type":"List[List[int]]","return_kind":"plain","starter":"class Solution:\n    def kClosest(self, points: List[List[int]], k: int) -> List[List[int]]:\n        pass\n","compare":"unordered","reference":"class Solution:\n    def kClosest(self, points: List[List[int]], k: int) -> List[List[int]]:\n        return heapq.nsmallest(k, points, key=lambda p: p[0] * p[0] + p[1] * p[1])\n","checker":null,"time_limit_ms":2000,"examples":[{"args":["[[1, 3], [-2, 2], [4, 0]]","1"],"expected":"[[-2, 2]]","why":"Squared distances are 10, 8 and 16. (-2, 2) is closest."},{"args":["[[3, 3], [5, -1], [-2, 4], [0, 1]]","2"],"expected":"[[0, 1], [3, 3]]","why":null}],"tests":[{"args":["[[0, 0]]","1"],"expected":"[[0, 0]]"},{"args":["[[1, 1], [2, 2], [3, 3]]","3"],"expected":"[[1, 1], [2, 2], [3, 3]]"},{"args":["[[-5, 4], [4, 6], [2, -1]]","2"],"expected":"[[2, -1], [-5, 4]]"},{"args":["[[i, 0] for i in range(50000, 0, -1)]","100"],"expected":null},{"args":["[[i, -i] for i in range(10**4, 0, -1)]","5"],"expected":"[[5, -5], [4, -4], [3, -3], [2, -2], [1, -1]]"}],"module":"heaps-dp","number":29},"word-split":{"id":"word-split","kind":"challenge","title":"Word Split","difficulty":"Medium","tags":["Dynamic Programming","Hash Set","Strings"],"description":"Given a string `s` and a list of dictionary words `wordDict`, return `True` if `s` can be split into a sequence of one or more dictionary words, with no letters left over. Words may be reused any number of times.","constraints":["`1 <= len(s) <= 300`","`1 <= len(wordDict) <= 1000`","`1 <= len(wordDict[i]) <= 20`"],"hints":["Trying every split recursively explodes on inputs like `\"aaaa…ab\"`.","Let `ok[i]` mean \"the first `i` characters can be split\". Then `ok[0]` is `True`.","`ok[i]` is true if some dictionary word ends at `i` and `ok[i - len(word)]` is true. Use a set for O(1) word lookups."],"explanation":"`ok[i]` is `True` when `s[:i]` splits into dictionary words. It holds if some word `w` matches the last `len(w)` characters of that prefix and `ok[i - len(w)]` is true. A set makes each substring check O(1) (plus slicing), and only word lengths that actually occur need trying. Plain recursion re-explores the same prefixes exponentially often, which the `\"aaa…ab\"` test exposes.\n\n**Complexity:** O(n × L × w) time, where L is the number of distinct word lengths and w is the longest word (for slicing). O(n) space.","style":"class","entry":"wordBreak","params":[{"name":"s","type":"str","kind":"plain"},{"name":"wordDict","type":"List[str]","kind":"plain"}],"return_type":"bool","return_kind":"plain","starter":"class Solution:\n    def wordBreak(self, s: str, wordDict: List[str]) -> bool:\n        pass\n","compare":"exact","reference":"class Solution:\n    def wordBreak(self, s: str, wordDict: List[str]) -> bool:\n        words = set(wordDict)\n        lengths = {len(w) for w in words}\n        ok = [True] + [False] * len(s)\n        for i in range(1, len(s) + 1):\n            for size in lengths:\n                if size <= i and ok[i - size] and s[i - size:i] in words:\n                    ok[i] = True\n                    break\n        return ok[len(s)]\n","checker":null,"time_limit_ms":2000,"examples":[{"args":["'sunflowerpot'","['sun', 'flower', 'pot', 'flow']"],"expected":"True","why":"\"sun\" + \"flower\" + \"pot\""},{"args":["'carpetsale'","['car', 'pet', 'sale', 'carp', 'ets']"],"expected":"True","why":null},{"args":["'doghouses'","['dog', 'house', 'hou']"],"expected":"False","why":"The final \"s\" can never be matched."}],"tests":[{"args":["'a'","['a']"],"expected":"True"},{"args":["'aaaaaaa'","['aaaa', 'aaa']"],"expected":"True"},{"args":["'abcd'","['a', 'abc', 'b', 'cd']"],"expected":"True"},{"args":["'cars'","['car', 'ca', 'rs']"],"expected":"True"},{"args":["'ab'","['a']"],"expected":"False"},{"args":["'goalspecial'","['go', 'goal', 'goals', 'special']"],"expected":"True"},{"args":["'a' * 150 + 'b'","['a' * i for i in range(1, 11)]"],"expected":"False"},{"args":["'ab' * 150","['a', 'b', 'ab', 'ba', 'aba', 'bab']"],"expected":"True"}],"module":"heaps-dp","number":30},"fewest-edits":{"id":"fewest-edits","kind":"challenge","title":"Fewest Edits","difficulty":"Medium","tags":["Dynamic Programming","Strings","2-D Tables"],"description":"Given two strings `word1` and `word2`, return the minimum number of single-character operations needed to turn `word1` into `word2`. The allowed operations are:\n\n- **insert** a character\n- **delete** a character\n- **replace** a character with another","constraints":["`0 <= len(word1), len(word2) <= 300`","Both strings contain lower-case English letters"],"hints":["Let `dp[i][j]` be the edits needed to turn `word1[:i]` into `word2[:j]`.","Base cases: turning a prefix into the empty string takes `i` deletions, and building `word2[:j]` from nothing takes `j` insertions.","If the last characters match, `dp[i][j] = dp[i - 1][j - 1]`. Otherwise it's 1 plus the best of delete `dp[i - 1][j]`, insert `dp[i][j - 1]` and replace `dp[i - 1][j - 1]`."],"explanation":"This is the classic **Levenshtein distance**. `dp[i][j]` is the answer for the prefixes `word1[:i]` and `word2[:j]`. When the last characters match, they cost nothing, so take `dp[i - 1][j - 1]`. Otherwise the last operation was one of three:\n\n- delete `word1[i - 1]`, costing `dp[i - 1][j] + 1`\n- insert `word2[j - 1]`, costing `dp[i][j - 1] + 1`\n- replace one with the other, costing `dp[i - 1][j - 1] + 1`\n\nThe first row and column are `0, 1, 2, …`. Keeping only the previous row reduces memory to O(n).\n\n**Complexity:** O(m × n) time, O(n) space.","style":"class","entry":"minDistance","params":[{"name":"word1","type":"str","kind":"plain"},{"name":"word2","type":"str","kind":"plain"}],"return_type":"int","return_kind":"plain","starter":"class Solution:\n    def minDistance(self, word1: str, word2: str) -> int:\n        pass\n","compare":"exact","reference":"class Solution:\n    def minDistance(self, word1: str, word2: str) -> int:\n        m, n = len(word1), len(word2)\n        prev = list(range(n + 1))\n        for i in range(1, m + 1):\n            cur = [i] + [0] * n\n            for j in range(1, n + 1):\n                if word1[i - 1] == word2[j - 1]:\n                    cur[j] = prev[j - 1]\n                else:\n                    cur[j] = 1 + min(prev[j], cur[j - 1], prev[j - 1])\n            prev = cur\n        return prev[n]\n","checker":null,"time_limit_ms":2000,"examples":[{"args":["'kitten'","'sitting'"],"expected":"3","why":"Replace k→s, replace e→i, insert g."},{"args":["'sunday'","'saturday'"],"expected":"3","why":null},{"args":["''","'abc'"],"expected":"3","why":null}],"tests":[{"args":["'a'","'a'"],"expected":"0"},{"args":["'abc'","''"],"expected":"3"},{"args":["'intention'","'execution'"],"expected":"5"},{"args":["'flaw'","'lawn'"],"expected":"2"},{"args":["'python'","'pythons'"],"expected":"1"},{"args":["'abcdef'","'azced'"],"expected":"3"},{"args":["rand_str(300, 'abc', seed=72)","rand_str(280, 'abc', seed=73)"],"expected":null}],"module":"heaps-dp","number":31},"merge-k-chains":{"id":"merge-k-chains","kind":"challenge","title":"Merge K Sorted Chains","difficulty":"Hard","tags":["Heap","Linked List","Tuples","Dummy Node"],"description":"You're given a list `lists` of `k` linked lists, each sorted in non-decreasing order. Merge them all into **one sorted linked list** and return its head.","constraints":["`0 <= k <= 10⁴`","Each list has at most 500 nodes, and there are at most 10⁴ nodes in total","Each list is sorted in non-decreasing order"],"hints":["Repeatedly scanning all `k` list heads for the smallest costs O(k) per node.","A min-heap of the current heads gives the smallest in O(log k).","`ListNode`s can't be compared, so push `(value, list_index, node)`. The index breaks ties."],"explanation":"Keep a min-heap holding the current head of every non-empty list. Pop the smallest, append it to the result, and push that node's successor. The heap never holds more than `k` entries, so each of the N nodes costs O(log k).\n\nTies matter here. Python compares tuples element by element, and when two values are equal it would try to compare `ListNode`s, raising `TypeError`. A unique middle element, the list index, prevents that.\n\nAn alternative is divide and conquer: merge the lists in pairs, as in merge sort. That's also O(N log k).\n\n**Complexity:** O(N log k) time, O(k) heap space.","style":"class","entry":"mergeKLists","params":[{"name":"lists","type":"List[Optional[ListNode]]","kind":"linked_list"}],"return_type":"Optional[ListNode]","return_kind":"linked","starter":"# Definition for singly-linked list (already defined for you):\n# class ListNode:\n#     def __init__(self, val=0, next=None):\n#         self.val = val\n#         self.next = next\n\nclass Solution:\n    def mergeKLists(self, lists: List[Optional[ListNode]]) -> Optional[ListNode]:\n        pass\n","compare":"exact","reference":"class Solution:\n    def mergeKLists(self, lists: List[Optional[ListNode]]) -> Optional[ListNode]:\n        heap = []\n        for i, node in enumerate(lists):\n            if node:\n                heapq.heappush(heap, (node.val, i, node))\n        dummy = tail = ListNode()\n        while heap:\n            _, i, node = heapq.heappop(heap)\n            tail.next = node\n            tail = node\n            if node.next:\n                heapq.heappush(heap, (node.next.val, i, node.next))\n        return dummy.next\n","checker":null,"time_limit_ms":2000,"examples":[{"args":["[[2, 5, 9], [1, 6], [3, 4, 10]]"],"expected":"[1, 2, 3, 4, 5, 6, 9, 10]","why":null},{"args":["[]"],"expected":"[]","why":null},{"args":["[[]]"],"expected":"[]","why":null}],"tests":[{"args":["[[1], [0]]"],"expected":"[0, 1]"},{"args":["[[], [1, 1], []]"],"expected":"[1, 1]"},{"args":["[[-3, -1], [-2, 0, 2], []]"],"expected":"[-3, -2, -1, 0, 2]"},{"args":["[[5, 5], [5], [5, 5, 5]]"],"expected":"[5, 5, 5, 5, 5, 5]"},{"args":["[sorted(rand_list(20, -10**4, 10**4, seed=i)) for i in range(500)]"],"expected":null},{"args":["[sorted(rand_list(5, -10**4, 10**4, seed=1000 + i)) for i in range(2000)]"],"expected":null}],"module":"heaps-dp","number":32},"running-median":{"id":"running-median","kind":"challenge","title":"Running Median","difficulty":"Hard","tags":["Design","Heap","Classes"],"description":"Design a structure that receives numbers one at a time and can report the **median** of everything received so far.\n\n- `MedianFinder()` creates an empty structure.\n- `addNum(num)` adds a number.\n- `findMedian()` returns the median as a float. For an even count, that's the mean of the two middle values.\n\n`findMedian` is only called after at least one number has been added.","constraints":["`-10⁵ <= num <= 10⁵`","At most `4 × 10⁴` calls in total"],"hints":["Sorting on every `findMedian` is O(n log n) per call. Too slow when calls alternate.","Split the numbers into a lower half and an upper half. The median sits where they meet.","Keep the lower half in a max-heap and the upper half in a min-heap, with sizes differing by at most one."],"explanation":"Maintain two heaps: `low`, a max-heap of the smaller half (stored negated), and `high`, a min-heap of the larger half. Every element of `low` is at most every element of `high`, and `low` holds the same number of elements or one more.\n\nTo add a number, push it into `low`, move `low`'s largest across to `high` (which restores the ordering), and if `high` is now bigger, move its smallest back. The median is `low`'s top when the total count is odd, or the mean of both tops when it's even.\n\n**Complexity:** O(log n) per `addNum`, O(1) per `findMedian`.","style":"design","entry":"MedianFinder","params":[{"name":"operations","type":"List[str]","kind":"plain"},{"name":"arguments","type":"List[list]","kind":"plain"}],"return_type":"List","return_kind":"plain","starter":"class MedianFinder:\n    def __init__(self):\n        pass\n\n    def addNum(self, num: int) -> None:\n        pass\n\n    def findMedian(self) -> float:\n        pass\n","compare":"exact","reference":"class MedianFinder:\n    def __init__(self):\n        self.low = []     # max-heap (negated) holding the smaller half\n        self.high = []    # min-heap holding the larger half\n\n    def addNum(self, num: int) -> None:\n        heapq.heappush(self.low, -num)\n        heapq.heappush(self.high, -heapq.heappop(self.low))\n        if len(self.high) > len(self.low):\n            heapq.heappush(self.low, -heapq.heappop(self.high))\n\n    def findMedian(self) -> float:\n        if len(self.low) > len(self.high):\n            return float(-self.low[0])\n        return (-self.low[0] + self.high[0]) / 2\n","checker":null,"time_limit_ms":2000,"examples":[{"args":["['MedianFinder', 'addNum', 'addNum', 'findMedian', 'addNum', 'findMedian', 'addNum', 'findMedian']","[[], [5], [15], [], [1], [], [3], []]"],"expected":"[None, None, None, 10.0, None, 5.0, None, 4.0]","why":"Medians of [5, 15], [1, 5, 15] and [1, 3, 5, 15]."}],"tests":[{"args":["['MedianFinder', 'addNum', 'findMedian']","[[], [-7], []]"],"expected":"[None, None, -7.0]"},{"args":["['MedianFinder', 'addNum', 'addNum', 'addNum', 'findMedian']","[[], [2], [2], [2], []]"],"expected":"[None, None, None, None, 2.0]"},{"args":["['MedianFinder', 'addNum', 'addNum', 'findMedian']","[[], [1], [2], []]"],"expected":"[None, None, None, 1.5]"},{"args":["['MedianFinder'] + ['addNum', 'findMedian'] * 20000","[[]] + [x for v in rand_list(20000, -10**5, 10**5, seed=74) for x in ([v], [])]"],"expected":null}],"module":"heaps-dp","number":33}}};
window.PYFORGE_HARNESS = "\"\"\"PyForge judge: runs learner code against a problem's test cases.\n\nThis one file runs in two places:\n  * in the browser, inside Pyodide (CPython compiled to WebAssembly), and\n  * under your local Python when build.py validates every reference solution.\n\nKeep it standard-library only and compatible with Python 3.9+.\n\"\"\"\n\nimport builtins\nimport copy\nimport io\nimport json\nimport linecache\nimport math\nimport random\nimport sys\nimport time\nimport traceback\nfrom collections import deque\n\nUSER_FILE = \"solution.py\"\nMAX_STDOUT = 5000\nMAX_REPR = 800\nCASE_LIMIT_MS = 2000  # per-test time limit; problems can override with \"time_limit_ms\"\n\n# Names every solution can use without importing, like on LeetCode.\nPRELUDE = \"\"\"\nfrom typing import *\nimport collections, heapq, bisect, itertools, functools, math, string, re, random, operator\nfrom collections import deque, defaultdict, Counter, OrderedDict\nfrom heapq import heappush, heappop, heapify, heappushpop, heapreplace, nlargest, nsmallest\nfrom bisect import bisect_left, bisect_right, insort\nfrom functools import lru_cache, cache, reduce, cmp_to_key\nfrom itertools import accumulate, combinations, permutations, product, chain, groupby, zip_longest\nfrom math import inf, gcd, sqrt, ceil, floor, comb, factorial, isqrt\n\"\"\"\n\n\n# --------------------------------------------------------------------------\n# Data structures shared with learner code\n# --------------------------------------------------------------------------\n\nclass ListNode:\n    \"\"\"A node in a singly-linked list.\"\"\"\n\n    def __init__(self, val=0, next=None):\n        self.val = val\n        self.next = next\n\n    def __repr__(self):\n        parts, node = [], self\n        while node is not None and len(parts) < 12:\n            parts.append(repr(node.val))\n            node = node.next\n        if node is not None:\n            parts.append(\"...\")\n        return \"ListNode(\" + \" -> \".join(parts) + \")\"\n\n\nclass TreeNode:\n    \"\"\"A node in a binary tree.\"\"\"\n\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\n    def __repr__(self):\n        return \"TreeNode(%r)\" % (self.val,)\n\n\ndef to_linked(values):\n    dummy = tail = ListNode()\n    for v in values:\n        tail.next = ListNode(v)\n        tail = tail.next\n    return dummy.next\n\n\ndef from_linked(node, limit=200000):\n    out = []\n    while node is not None:\n        if len(out) >= limit:\n            raise ValueError(\"the returned linked list never ends (is there a cycle?)\")\n        if not hasattr(node, \"val\") or not hasattr(node, \"next\"):\n            raise TypeError(\"expected a ListNode but got %s\" % type(node).__name__)\n        out.append(node.val)\n        node = node.next\n    return out\n\n\ndef to_tree(values):\n    if not values or values[0] is None:\n        return None\n    root = TreeNode(values[0])\n    queue = deque([root])\n    i = 1\n    while queue and i < len(values):\n        node = queue.popleft()\n        if i < len(values) and values[i] is not None:\n            node.left = TreeNode(values[i])\n            queue.append(node.left)\n        i += 1\n        if i < len(values) and values[i] is not None:\n            node.right = TreeNode(values[i])\n            queue.append(node.right)\n        i += 1\n    return root\n\n\ndef from_tree(root, limit=200000):\n    out, queue = [], deque([root])\n    while queue:\n        node = queue.popleft()\n        if node is None:\n            out.append(None)\n            continue\n        if len(out) >= limit:\n            raise ValueError(\"the returned tree is too large (is there a cycle?)\")\n        if not hasattr(node, \"left\") or not hasattr(node, \"right\"):\n            raise TypeError(\"expected a TreeNode but got %s\" % type(node).__name__)\n        out.append(node.val)\n        queue.append(node.left)\n        queue.append(node.right)\n    while out and out[-1] is None:\n        out.pop()\n    return out\n\n\ndef dismantle(value, kind):\n    \"\"\"Cut the links inside node structures, iteratively.\n\n    Freeing a long chain of nodes frees each node from inside the previous\n    one. That recursion is harmless in native Python but overflows the much\n    smaller WebAssembly stack in the browser (around 10,000 nodes), so the\n    judge breaks structures apart once it has finished with them.\n    \"\"\"\n    if kind == \"plain\" or value is None:\n        return\n    stack = list(value) if kind == \"linked_list\" and isinstance(value, list) else [value]\n    seen = set()\n    while stack:\n        node = stack.pop()\n        if node is None or id(node) in seen:\n            continue\n        seen.add(id(node))\n        for attr in (\"next\", \"left\", \"right\"):\n            child = getattr(node, attr, None)\n            if child is not None and hasattr(child, \"__dict__\"):\n                stack.append(child)\n                try:\n                    setattr(node, attr, None)\n                except Exception:\n                    pass\n\n\ndef kind_of(annotation):\n    \"\"\"Map a type annotation to how values are converted at the boundary.\"\"\"\n    a = (annotation or \"\").replace(\" \", \"\")\n    if a in (\"ListNode\", \"Optional[ListNode]\"):\n        return \"linked\"\n    if a in (\"TreeNode\", \"Optional[TreeNode]\"):\n        return \"tree\"\n    if a in (\"List[ListNode]\", \"List[Optional[ListNode]]\"):\n        return \"linked_list\"\n    return \"plain\"\n\n\ndef encode(value, kind):\n    if kind == \"linked\":\n        return to_linked(value)\n    if kind == \"tree\":\n        return to_tree(value)\n    if kind == \"linked_list\":\n        return [to_linked(v) for v in value]\n    return value\n\n\ndef decode(value, kind):\n    if kind == \"linked\":\n        return from_linked(value)\n    if kind == \"tree\":\n        return from_tree(value)\n    if kind == \"linked_list\":\n        return [from_linked(v) for v in value]\n    return normalize(value)\n\n\n# --------------------------------------------------------------------------\n# Helpers available inside test-case expressions\n# --------------------------------------------------------------------------\n\ndef rand_list(n, lo, hi, seed=0):\n    r = random.Random(seed)\n    return [r.randint(lo, hi) for _ in range(n)]\n\n\ndef rand_str(n, alphabet=\"abcdefghijklmnopqrstuvwxyz\", seed=0):\n    r = random.Random(seed)\n    return \"\".join(r.choice(alphabet) for _ in range(n))\n\n\ndef rand_grid(rows, cols, choices, seed=0):\n    r = random.Random(seed)\n    return [[r.choice(choices) for _ in range(cols)] for _ in range(rows)]\n\n\ndef rand_sorted(n, lo, hi, seed=0):\n    \"\"\"n distinct sorted integers from [lo, hi].\"\"\"\n    r = random.Random(seed)\n    return sorted(r.sample(range(lo, hi + 1), n))\n\n\ndef _case_env():\n    # Test inputs are Python expressions (so hidden tests can build large\n    # inputs like `rand_list(10**5, 0, 9)`). They come from the lesson content\n    # or from the learner's own Testcase panel and are evaluated in the same\n    # sandbox that already runs the learner's code, so eval adds no new risk.\n    return {\n        \"__builtins__\": builtins,\n        \"null\": None, \"true\": True, \"false\": False,\n        \"rand_list\": rand_list, \"rand_str\": rand_str,\n        \"rand_grid\": rand_grid, \"rand_sorted\": rand_sorted,\n    }\n\n\n# --------------------------------------------------------------------------\n# Comparing and showing values\n# --------------------------------------------------------------------------\n\n_ATOMIC = (int, float, str, bool, type(None))\n\n\ndef clone(value):\n    \"\"\"A fast deep copy for the plain data used in test cases.\"\"\"\n    t = type(value)\n    if t is list:\n        if all(type(x) in _ATOMIC for x in value):\n            return value[:]\n        return [clone(x) for x in value]\n    if t in _ATOMIC:\n        return value\n    if t is dict:\n        return {k: clone(v) for k, v in value.items()}\n    if t is tuple:\n        return tuple(clone(x) for x in value)\n    if t is set:\n        return set(value)\n    return copy.deepcopy(value)\n\n\ndef normalize(value):\n    \"\"\"Treat tuples as lists so `return (a, b)` matches `[a, b]`.\"\"\"\n    if isinstance(value, (list, tuple)):\n        if all(type(x) in _ATOMIC for x in value):\n            return list(value)\n        return [normalize(x) for x in value]\n    return value\n\n\ndef same(a, b):\n    if isinstance(a, bool) or isinstance(b, bool):\n        return type(a) is type(b) and a == b\n    if isinstance(a, float) or isinstance(b, float):\n        if isinstance(a, (int, float)) and isinstance(b, (int, float)):\n            return math.isclose(a, b, rel_tol=1e-6, abs_tol=1e-6)\n        return False\n    if isinstance(a, list) and isinstance(b, list):\n        return len(a) == len(b) and all(same(x, y) for x, y in zip(a, b))\n    if isinstance(a, dict) and isinstance(b, dict):\n        return a.keys() == b.keys() and all(same(a[k], b[k]) for k in a)\n    return a == b\n\n\ndef _sorted_any(values):\n    try:\n        return sorted(values)\n    except TypeError:\n        return sorted(values, key=repr)\n\n\ndef matches(output, expected, mode, checker=None, args=None):\n    if checker is not None:\n        return bool(checker(output, expected, *args))\n    if mode == \"unordered\":\n        if not isinstance(output, list):\n            return False\n        return same(_sorted_any(output), _sorted_any(expected))\n    if mode == \"unordered_deep\":\n        if not isinstance(output, list) or not all(isinstance(x, list) for x in output):\n            return False\n        norm = lambda rows: _sorted_any([_sorted_any(r) for r in rows])\n        return same(norm(output), norm(expected))\n    return same(output, expected)\n\n\ndef show(value):\n    try:\n        text = repr(value)\n    except Exception as exc:  # a learner's __repr__ can fail\n        text = \"<unprintable: %s>\" % type(exc).__name__\n    if len(text) > MAX_REPR:\n        text = text[:MAX_REPR] + \" \u2026 (%d characters)\" % len(text)\n    return text\n\n\n# --------------------------------------------------------------------------\n# Running learner code\n# --------------------------------------------------------------------------\n\nclass _Capture(io.TextIOBase):\n    \"\"\"Collects printed output, keeping only the first MAX_STDOUT characters.\"\"\"\n\n    def __init__(self):\n        self.parts = []\n        self.size = 0\n\n    def writable(self):\n        return True\n\n    def write(self, s):\n        if self.size < MAX_STDOUT:\n            self.parts.append(s[: MAX_STDOUT - self.size])\n        self.size += len(s)\n        return len(s)\n\n    def getvalue(self):\n        text = \"\".join(self.parts)\n        if self.size > MAX_STDOUT:\n            text += \"\\n\u2026 (output truncated)\"\n        return text\n\n\nclass _Redirect:\n    def __init__(self, capture):\n        self.capture = capture\n\n    def __enter__(self):\n        self.saved = sys.stdout, sys.stderr\n        sys.stdout = sys.stderr = self.capture\n\n    def __exit__(self, *exc):\n        sys.stdout, sys.stderr = self.saved\n        return False\n\n\ndef _no_input(prompt=\"\"):\n    raise RuntimeError(\"input() isn't available here. Put your test values straight into the code instead.\")\n\n\ndef make_namespace():\n    ns = {\"__name__\": \"__main__\", \"ListNode\": ListNode, \"TreeNode\": TreeNode}\n    exec(PRELUDE, ns)\n    ns[\"input\"] = _no_input\n    return ns\n\n\ndef load(code, filename):\n    linecache.cache[filename] = (len(code), None, code.splitlines(True), filename)\n    ns = make_namespace()\n    exec(compile(code, filename, \"exec\"), ns)\n    return ns\n\n\ndef format_syntax_error(exc):\n    text = \"\".join(traceback.format_exception_only(type(exc), exc))\n    return text.replace('File \"%s\", line' % USER_FILE, \"Line\").rstrip()\n\n\ndef format_error(exc):\n    frames = [f for f in traceback.extract_tb(exc.__traceback__) if f.filename == USER_FILE]\n    lines = [\"Traceback (most recent call last):\"] if frames else []\n    shown = frames\n    hidden = 0\n    if len(frames) > 8:  # deep recursion: keep the ends, drop the middle\n        shown = frames[:3] + frames[-3:]\n        hidden = len(frames) - 6\n    for n, f in enumerate(shown):\n        if hidden and n == 3:\n            lines.append(\"  \u2026 %d more calls \u2026\" % hidden)\n        lines.append(\"  Line %d, in %s\" % (f.lineno, f.name))\n        if f.line:\n            lines.append(\"    \" + f.line.strip())\n    message = str(exc)\n    lines.append(\"%s: %s\" % (type(exc).__name__, message) if message else type(exc).__name__)\n    return \"\\n\".join(lines)\n\n\ndef _find_target(ns, problem):\n    style, entry = problem[\"style\"], problem[\"entry\"]\n    if style == \"class\":\n        cls = ns.get(\"Solution\")\n        if not isinstance(cls, type):\n            raise LookupError(\"Couldn't find `class Solution`. Keep the class name from the starter code.\")\n        method = getattr(cls(), entry, None)\n        if method is None:\n            raise LookupError(\"`Solution` has no method called `%s`. Keep the method name from the starter code.\" % entry)\n        return method\n    if style == \"design\":\n        cls = ns.get(entry)\n        if not isinstance(cls, type):\n            raise LookupError(\"Couldn't find `class %s`. Keep the class name from the starter code.\" % entry)\n        return cls\n    fn = ns.get(entry)\n    if not callable(fn):\n        raise LookupError(\"Couldn't find a function called `%s`. Keep the name from the starter code.\" % entry)\n    return fn\n\n\ndef _invoke(target, problem, args):\n    \"\"\"Call the learner's code on one case. Returns (comparable value, milliseconds).\"\"\"\n    if problem[\"style\"] == \"design\":\n        operations, arguments = args\n        if not operations or len(operations) != len(arguments):\n            raise ValueError(\"a design test needs one argument list per operation\")\n        t0 = time.perf_counter()\n        obj = target(*clone(arguments[0]))\n        outputs = [None]\n        for op, op_args in zip(operations[1:], arguments[1:]):\n            method = getattr(obj, op, None)\n            if method is None:\n                raise AttributeError(\"'%s' object has no method '%s'\" % (problem[\"entry\"], op))\n            outputs.append(normalize(method(*clone(op_args))))\n        return outputs, (time.perf_counter() - t0) * 1000\n\n    params = problem[\"params\"]\n    call_args = [encode(clone(a), p[\"kind\"]) for a, p in zip(args, params)]\n    returned = None\n    try:\n        t0 = time.perf_counter()\n        returned = target(*call_args)\n        ms = (time.perf_counter() - t0) * 1000\n        compare = problem.get(\"compare\", \"exact\")\n        if compare.startswith(\"inplace:\"):\n            idx = int(compare.split(\":\", 1)[1])\n            return decode(call_args[idx], params[idx][\"kind\"]), ms\n        return decode(returned, problem[\"return_kind\"]), ms\n    finally:\n        dismantle(returned, problem[\"return_kind\"])\n        for a, p in zip(call_args, params):\n            dismantle(a, p[\"kind\"])\n\n\ndef _describe_inputs(problem, args):\n    return [{\"name\": p[\"name\"], \"value\": show(a)} for p, a in zip(problem[\"params\"], args)]\n\n\ndef judge(problem, code, mode=\"submit\", cases=None, progress=None):\n    \"\"\"Judge `code` against a problem.\n\n    mode=\"run\":    run `cases` (default: the examples); expected answers come\n                   from the reference solution, so edited inputs work too.\n    mode=\"submit\": run every example and hidden test, stopping at the first\n                   failure, like a real judge.\n    \"\"\"\n    if mode == \"run\":\n        case_list = cases if cases is not None else problem[\"examples\"]\n    else:\n        case_list = problem[\"examples\"] + problem[\"tests\"]\n    compare = problem.get(\"compare\", \"exact\")\n    limit_ms = problem.get(\"time_limit_ms\") or CASE_LIMIT_MS\n    result = {\n        \"status\": None, \"mode\": mode, \"passed\": 0, \"total\": len(case_list),\n        \"runtime_ms\": 0.0, \"slowest_ms\": 0.0, \"limit_ms\": limit_ms,\n        \"cases\": [], \"error\": None, \"last_input\": None,\n    }\n\n    # progress(i, total) is called just before the learner's code runs, so the\n    # browser can time each test and stop the worker if one runs too long.\n    # i = -1 covers loading the module (top-level code).\n    if progress is not None:\n        progress(-1, len(case_list))\n    setup_out = _Capture()\n    try:\n        with _Redirect(setup_out):\n            user_ns = load(code, USER_FILE)\n        target = _find_target(user_ns, problem)\n    except SyntaxError as exc:\n        result.update(status=\"Compile Error\", error=format_syntax_error(exc))\n        return result\n    except LookupError as exc:\n        result.update(status=\"Runtime Error\", error=str(exc))\n        return result\n    except BaseException as exc:\n        result.update(status=\"Runtime Error\", error=format_error(exc))\n        return result\n\n    ref_ns = load(problem[\"reference\"], \"reference.py\")\n    ref_target = _find_target(ref_ns, problem)\n    checker = None\n    if problem.get(\"checker\"):\n        checker_ns = load(problem[\"checker\"], \"checker.py\")\n        checker = checker_ns[\"check\"]\n\n    env = _case_env()\n    for i, case in enumerate(case_list):\n        try:\n            args = [eval(expr, env) for expr in case[\"args\"]]\n        except Exception as exc:\n            result.update(status=\"Invalid Testcase\",\n                          error=\"Couldn't read the input for case %d: %s: %s\" % (i + 1, type(exc).__name__, exc))\n            return result\n        if len(args) != len(problem[\"params\"]):\n            result.update(status=\"Invalid Testcase\",\n                          error=\"Case %d has %d inputs but the function takes %d.\" % (i + 1, len(args), len(problem[\"params\"])))\n            return result\n        inputs = _describe_inputs(problem, args)\n        result[\"last_input\"] = inputs\n\n        expected_error = None\n        if mode == \"submit\" and case.get(\"expected\") is not None:\n            expected = eval(case[\"expected\"], env)\n        else:\n            try:\n                with _Redirect(_Capture()):\n                    expected, _ = _invoke(ref_target, problem, args)\n            except Exception as exc:\n                expected = None\n                expected_error = \"The reference solution couldn't handle this input (%s). Check that it follows the constraints.\" % type(exc).__name__\n\n        out = _Capture()\n        if i == 0:\n            out.write(setup_out.getvalue())\n        if progress is not None:\n            progress(i, len(case_list))\n        try:\n            with _Redirect(out):\n                output, ms = _invoke(target, problem, args)\n        except BaseException as exc:  # includes RecursionError and SystemExit\n            result.update(status=\"Runtime Error\", error=format_error(exc))\n            result[\"cases\"].append({\"index\": i, \"input\": inputs, \"stdout\": out.getvalue(),\n                                    \"output\": None, \"expected\": show(expected), \"passed\": False})\n            return result\n\n        result[\"runtime_ms\"] += ms\n        result[\"slowest_ms\"] = max(result[\"slowest_ms\"], round(ms, 2))\n        if ms > limit_ms:\n            result[\"status\"] = \"Time Limit Exceeded\"\n            result[\"cases\"].append({\"index\": i, \"input\": inputs, \"stdout\": out.getvalue(), \"ms\": round(ms, 1),\n                                    \"output\": None, \"expected\": None, \"passed\": False})\n            result[\"runtime_ms\"] = round(result[\"runtime_ms\"], 2)\n            return result\n        ok = expected_error is None and matches(output, expected, compare, checker, args)\n        entry = {\"index\": i, \"input\": inputs, \"output\": show(output),\n                 \"expected\": expected_error or show(expected), \"stdout\": out.getvalue(),\n                 \"passed\": ok, \"ms\": round(ms, 2)}\n        if ok:\n            result[\"passed\"] += 1\n            if mode == \"run\":\n                result[\"cases\"].append(entry)\n        else:\n            result[\"cases\"].append(entry)\n            if mode == \"submit\":\n                result[\"status\"] = \"Wrong Answer\"\n                return result\n\n    if mode == \"run\":\n        result[\"status\"] = \"Accepted\" if result[\"passed\"] == len(case_list) else \"Wrong Answer\"\n    else:\n        result[\"status\"] = \"Accepted\"\n    result[\"runtime_ms\"] = round(result[\"runtime_ms\"], 2)\n    return result\n\n\ndef run_script(code, setup=None):\n    \"\"\"Run a free-form snippet (lesson examples) and capture what it prints.\n\n    `setup` is optional lesson code (helper functions) run silently first.\n    \"\"\"\n    out = _Capture()\n    error = None\n    try:\n        with _Redirect(out):\n            ns = make_namespace()\n            if setup:\n                exec(compile(setup, \"lesson_setup.py\", \"exec\"), ns)\n            linecache.cache[USER_FILE] = (len(code), None, code.splitlines(True), USER_FILE)\n            exec(compile(code, USER_FILE, \"exec\"), ns)\n    except SyntaxError as exc:\n        error = format_syntax_error(exc)\n    except BaseException as exc:\n        error = format_error(exc)\n    return {\"stdout\": out.getvalue(), \"error\": error}\n\n\ndef handle(request_json, progress=None):\n    \"\"\"Entry point used by the browser worker.\"\"\"\n    request = json.loads(request_json)\n    if request[\"action\"] == \"script\":\n        response = run_script(request[\"code\"], request.get(\"setup\"))\n    else:\n        response = judge(request[\"problem\"], request[\"code\"], request.get(\"mode\", \"submit\"),\n                         request.get(\"cases\"), progress)\n    return json.dumps(response)\n";

</script>
<script>
/* A small Markdown renderer covering what PyForge content uses:
   headings, paragraphs, lists, tables, block quotes, fenced code and inline
   code / bold / italic / links. Fenced ```python blocks can be handed to a
   callback so lessons can turn them into runnable examples. */
(function () {
  "use strict";

  function escapeHtml(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function inline(text) {
    return text.split(/(`[^`]+`)/g).map(function (part) {
      if (part.length > 1 && part[0] === "`" && part[part.length - 1] === "`") {
        return "<code>" + escapeHtml(part.slice(1, -1)) + "</code>";
      }
      return escapeHtml(part)
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/(^|[^\w*])\*(?!\s)([^*]+?)\*(?!\w)/g, "$1<em>$2</em>")
        .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    }).join("");
  }

  function slug(text) {
    return text.toLowerCase().replace(/<[^>]+>/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  }

  function splitRow(line) {
    return line.trim().replace(/^\||\|$/g, "").split("|").map(function (c) { return c.trim(); });
  }

  /* Syntax-highlight Python using CodeMirror's runMode when available. */
  function highlight(code) {
    if (!window.CodeMirror || !CodeMirror.runMode) return escapeHtml(code);
    var html = "";
    CodeMirror.runMode(code, "python", function (text, style) {
      var t = escapeHtml(text);
      html += style ? '<span class="cm-' + style.replace(/ +/g, " cm-") + '">' + t + "</span>" : t;
    });
    return html;
  }

  var BLOCK_START = /^(```|#{1,4}\s|>|\s*[-*]\s+|\s*\d+\.\s+|\|)/;

  function render(src, opts) {
    opts = opts || {};
    var lines = String(src).split("\n");
    var out = [];
    var i = 0;

    while (i < lines.length) {
      var line = lines[i];
      var m;

      if ((m = line.match(/^```(\w*)\s*$/))) {
        var lang = m[1];
        var buf = [];
        i++;
        while (i < lines.length && !/^```\s*$/.test(lines[i])) { buf.push(lines[i]); i++; }
        i++;
        var code = buf.join("\n");
        if (lang === "python" && opts.onPython) {
          out.push(opts.onPython(code));
        } else {
          var body = lang === "python" ? highlight(code) : escapeHtml(code);
          out.push('<pre class="md-pre' + (lang === "text" ? " md-text" : "") + '"><code>' + body + "</code></pre>");
        }
        continue;
      }

      if (!line.trim()) { i++; continue; }

      if ((m = line.match(/^(#{1,4})\s+(.*)$/))) {
        var level = Math.min(6, m[1].length + (opts.headingOffset || 0));
        var content = inline(m[2]);
        var id = slug(m[2]);
        if (opts.onHeading) opts.onHeading(level, m[2], id);
        out.push("<h" + level + ' id="' + id + '">' + content + "</h" + level + ">");
        i++;
        continue;
      }

      if (/^\|.*\|\s*$/.test(line) && i + 1 < lines.length && /^\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
        var head = splitRow(line);
        var rows = [];
        i += 2;
        while (i < lines.length && /^\|.*\|\s*$/.test(lines[i])) { rows.push(splitRow(lines[i])); i++; }
        var t = '<div class="table-wrap"><table><thead><tr>' +
          head.map(function (c) { return "<th>" + inline(c) + "</th>"; }).join("") + "</tr></thead><tbody>" +
          rows.map(function (r) { return "<tr>" + r.map(function (c) { return "<td>" + inline(c) + "</td>"; }).join("") + "</tr>"; }).join("") +
          "</tbody></table></div>";
        out.push(t);
        continue;
      }

      if (line.startsWith(">")) {
        var quote = [];
        while (i < lines.length && lines[i].startsWith(">")) { quote.push(lines[i].replace(/^>\s?/, "")); i++; }
        out.push('<aside class="callout"><p>' + inline(quote.join(" ")) + "</p></aside>");
        continue;
      }

      var ordered = /^\s*\d+\.\s+/.test(line);
      if (ordered || /^\s*[-*]\s+/.test(line)) {
        var itemRe = ordered ? /^\s*\d+\.\s+/ : /^\s*[-*]\s+/;
        var items = [];
        while (i < lines.length && lines[i].trim()) {
          if (itemRe.test(lines[i])) items.push(lines[i].replace(itemRe, ""));
          else if (/^\s+/.test(lines[i]) && items.length) items[items.length - 1] += " " + lines[i].trim();
          else break;
          i++;
        }
        var tag = ordered ? "ol" : "ul";
        out.push("<" + tag + ">" + items.map(function (it) { return "<li>" + inline(it) + "</li>"; }).join("") + "</" + tag + ">");
        continue;
      }

      var para = [];
      while (i < lines.length && lines[i].trim() && !(para.length && BLOCK_START.test(lines[i]))) {
        para.push(lines[i].trim());
        i++;
      }
      out.push("<p>" + inline(para.join(" ")) + "</p>");
    }
    return out.join("\n");
  }

  window.MD = { render: render, inline: inline, escapeHtml: escapeHtml, highlight: highlight };
})();

</script>
<script>
/* Runs Python in the browser with Pyodide.

   Pyodide lives in a Web Worker so that learner code which never finishes can
   be stopped: when a run exceeds its time limit the worker is terminated and a
   fresh one is started, and the run is reported as "Time Limit Exceeded".
   If the browser refuses to create a worker, Python runs on the page itself
   (without time limits) as a fallback. */
(function () {
  "use strict";

  var PYODIDE_VERSION = "0.29.5";
  var INDEX_URL = "https://cdn.jsdelivr.net/npm/pyodide@" + PYODIDE_VERSION + "/";

  // Everything inside this function runs in the worker, not on the page.
  function workerMain() {
    var handle = null;

    async function boot(indexURL, harness) {
      importScripts(indexURL + "pyodide.js");
      var pyodide = await loadPyodide({ indexURL: indexURL });
      pyodide.FS.writeFile("/home/pyodide/pyforge_harness.py", harness);
      pyodide.runPython("import sys\nsys.path.insert(0, '/home/pyodide')\nimport pyforge_harness");
      handle = pyodide.pyimport("pyforge_harness").handle;
    }

    self.onmessage = async function (event) {
      var msg = event.data;
      if (msg.type === "init") {
        try {
          await boot(msg.indexURL, msg.harness);
          self.postMessage({ type: "ready" });
        } catch (err) {
          self.postMessage({ type: "init-error", error: String((err && err.message) || err) });
        }
        return;
      }
      if (msg.type === "run") {
        try {
          var progress = function (index, total) {
            self.postMessage({ type: "progress", id: msg.id, index: index, total: total });
          };
          var text = handle(JSON.stringify(msg.request), progress);
          self.postMessage({ type: "result", id: msg.id, result: JSON.parse(text) });
        } catch (err) {
          self.postMessage({ type: "result", id: msg.id, error: String((err && err.message) || err) });
        }
      }
    };
  }

  function PyRunner(harnessSource) {
    this.harness = harnessSource;
    this.worker = null;
    this.ready = null;
    this.mainThread = null;
    this.seq = 0;
    this.chain = Promise.resolve();
    this.listeners = [];
    this.state = "idle";
  }

  PyRunner.prototype.onState = function (fn) {
    this.listeners.push(fn);
    fn(this.state, this.detail);
  };

  PyRunner.prototype._setState = function (state, detail) {
    this.state = state;
    this.detail = detail;
    this.listeners.forEach(function (fn) { fn(state, detail); });
  };

  /* Start Python if it isn't running yet. Resolves once it's ready. */
  PyRunner.prototype.start = function () {
    if (this.ready) return this.ready;
    var self = this;
    this._setState("loading", "Starting Python…");
    this.ready = new Promise(function (resolve, reject) {
      var worker;
      try {
        var src = "(" + workerMain.toString() + ")();";
        var url = URL.createObjectURL(new Blob([src], { type: "text/javascript" }));
        worker = new Worker(url);
      } catch (err) {
        self._startMainThread().then(resolve, reject);
        return;
      }
      self.worker = worker;
      var onMessage = function (e) {
        if (e.data.type === "ready") {
          worker.removeEventListener("message", onMessage);
          self._setState("ready", "Python ready");
          resolve();
        } else if (e.data.type === "init-error") {
          worker.removeEventListener("message", onMessage);
          worker.terminate();
          self.worker = null;
          self._startMainThread().then(resolve, reject);
        }
      };
      worker.addEventListener("message", onMessage);
      worker.addEventListener("error", function (e) {
        if (self.state === "loading") {
          worker.terminate();
          self.worker = null;
          self._startMainThread().then(resolve, reject);
        }
        e.preventDefault && e.preventDefault();
      });
      worker.postMessage({ type: "init", indexURL: INDEX_URL, harness: self.harness });
    });
    this.ready.catch(function (err) {
      self.ready = null;
      self._setState("error", "Python failed to load: " + ((err && err.message) || err));
    });
    return this.ready;
  };

  /* Fallback: load Pyodide on the page itself. */
  PyRunner.prototype._startMainThread = function () {
    var self = this;
    return new Promise(function (resolve, reject) {
      var script = document.createElement("script");
      script.src = INDEX_URL + "pyodide.js";
      script.onload = async function () {
        try {
          var pyodide = await window.loadPyodide({ indexURL: INDEX_URL });
          pyodide.FS.writeFile("/home/pyodide/pyforge_harness.py", self.harness);
          pyodide.runPython("import sys\nsys.path.insert(0, '/home/pyodide')\nimport pyforge_harness");
          self.mainThread = pyodide.pyimport("pyforge_harness").handle;
          self._setState("ready", "Python ready (no time limit in this browser)");
          resolve();
        } catch (err) { reject(err); }
      };
      script.onerror = function () { reject(new Error("couldn't download Pyodide. Check your internet connection.")); };
      document.head.appendChild(script);
    });
  };

  PyRunner.prototype.restart = function () {
    if (this.worker) this.worker.terminate();
    this.worker = null;
    this.ready = null;
    this.start();
  };

  /* Run one request. Requests are queued so only one runs at a time.
     Resolves with the harness result, or {status: "Time Limit Exceeded"} if
     the whole run exceeds options.timeoutMs or a single test (announced by a
     progress message) runs longer than options.caseTimeoutMs. */
  PyRunner.prototype.run = function (request, options) {
    var self = this;
    var job = this.chain.then(function () { return self._run(request, options || {}); });
    this.chain = job.catch(function () {});
    return job;
  };

  PyRunner.prototype._run = async function (request, options) {
    await this.start();
    var self = this;
    this._setState("busy", "Running…");

    if (this.mainThread) {
      await new Promise(function (r) { setTimeout(r, 30); }); // let the UI paint first
      try {
        var text = this.mainThread(JSON.stringify(request), function (index, total) {
          if (options.onProgress && index >= 0) options.onProgress({ index: index, total: total });
        });
        return JSON.parse(text);
      } catch (err) {
        return { status: "Internal Error", error: String((err && err.message) || err) };
      } finally {
        this._setState("ready", "Python ready (no time limit in this browser)");
      }
    }

    return new Promise(function (resolve) {
      var id = ++self.seq;
      var worker = self.worker;
      var last = null;
      var caseTimer = null;
      function stop(killedBy, limitMs) {
        cleanup();
        self.restart();
        resolve({ status: "Time Limit Exceeded", progress: last, killedBy: killedBy, limitMs: limitMs });
      }
      var timer = setTimeout(function () { stop("total", options.timeoutMs); }, options.timeoutMs || 10000);
      function onMessage(e) {
        var m = e.data;
        if (m.id !== id) return;
        if (m.type === "progress") {
          last = m;
          if (options.caseTimeoutMs) {
            clearTimeout(caseTimer);
            caseTimer = setTimeout(function () { stop("case", options.caseTimeoutMs); }, options.caseTimeoutMs);
          }
          if (options.onProgress && m.index >= 0) options.onProgress(m);
        } else if (m.type === "result") {
          cleanup();
          self._setState("ready", "Python ready");
          if (m.error) {
            // A JavaScript-level failure (e.g. a stack overflow) can leave
            // Python in a broken state, so start a fresh interpreter.
            self.restart();
            resolve({ status: "Internal Error", error: m.error });
          } else {
            resolve(m.result);
          }
        }
      }
      function cleanup() {
        clearTimeout(timer);
        clearTimeout(caseTimer);
        worker.removeEventListener("message", onMessage);
      }
      worker.addEventListener("message", onMessage);
      worker.postMessage({ type: "run", id: id, request: request });
    });
  };

  window.PyRunner = PyRunner;
})();

</script>
<script>
/* PyForge app: routing, views and the problem workspace. */
(function () {
  "use strict";

  var CONTENT = window.PYFORGE_CONTENT;
  var MODULES = CONTENT.modules;
  var PROBLEMS = CONTENT.problems;
  var esc = MD.escapeHtml;
  var app = document.getElementById("app");

  // Hard stops for code that never finishes. The judge also enforces a
  // per-test limit (2 s by default) and reports slower tests as TLE.
  var RUN_TIMEOUT_MS = 15000;
  var SUBMIT_TIMEOUT_MS = 30000;
  var SCRIPT_TIMEOUT_MS = 8000;
  var CASE_GRACE_MS = 1500; // slack on top of the per-test limit before the worker is stopped

  // -------------------------------------------------------------------------
  // Content indexes
  // -------------------------------------------------------------------------

  var LESSONS = {};
  var LESSON_ORDER = [];
  var EXERCISE_ORDER = [];
  MODULES.forEach(function (m) {
    m.lessons.forEach(function (l, i) {
      l.module = m;
      l.index = i;
      LESSONS[l.id] = l;
      LESSON_ORDER.push(l);
      l.exercises.forEach(function (id) { EXERCISE_ORDER.push(id); });
    });
  });
  var CHALLENGE_ORDER = Object.keys(PROBLEMS).filter(function (id) { return PROBLEMS[id].kind === "challenge"; })
    .sort(function (a, b) { return PROBLEMS[a].number - PROBLEMS[b].number; });
  var MODULE_BY_ID = {};
  MODULES.forEach(function (m) { MODULE_BY_ID[m.id] = m; });

  // -------------------------------------------------------------------------
  // Progress storage (this browser only)
  // -------------------------------------------------------------------------

  var Store = (function () {
    var KEY = "pyforge:v1";
    function blank() {
      return { solved: {}, code: {}, subs: {}, visited: {}, activity: {}, revealed: {}, cases: {}, layout: {}, theme: null };
    }
    var store = { d: blank() };
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) store.d = Object.assign(blank(), JSON.parse(raw));
    } catch (e) { /* storage unavailable: progress lasts for this visit only */ }
    var timer = null;
    store.flush = function () {
      clearTimeout(timer);
      try { localStorage.setItem(KEY, JSON.stringify(store.d)); } catch (e) { /* ignore */ }
    };
    store.save = function () { clearTimeout(timer); timer = setTimeout(store.flush, 300); };
    store.reset = function () { var theme = store.d.theme; store.d = blank(); store.d.theme = theme; store.flush(); };
    store.replace = function (data) { store.d = Object.assign(blank(), data); store.flush(); };
    window.addEventListener("beforeunload", store.flush);
    return store;
  })();

  function isSolved(id) { return !!Store.d.solved[id]; }
  function problemStatus(id) {
    if (isSolved(id)) return "solved";
    return (Store.d.subs[id] || []).length ? "attempted" : "todo";
  }
  function lessonStats(l) {
    var done = l.exercises.filter(isSolved).length;
    return { done: done, total: l.exercises.length, complete: done === l.exercises.length };
  }
  function lessonStatus(l) {
    var s = lessonStats(l);
    if (s.complete) return "solved";
    return Store.d.visited[l.id] || s.done ? "attempted" : "todo";
  }
  function moduleStats(m) {
    var lessonsDone = m.lessons.filter(function (l) { return lessonStats(l).complete; }).length;
    var chSolved = m.challenges.filter(isSolved).length;
    return { lessonsDone: lessonsDone, lessons: m.lessons.length, chSolved: chSolved, challenges: m.challenges.length,
      complete: lessonsDone === m.lessons.length && chSolved === m.challenges.length };
  }
  function totals() {
    var t = { lessons: LESSON_ORDER.length, lessonsDone: 0, exercises: EXERCISE_ORDER.length, exercisesDone: 0,
      challenges: CHALLENGE_ORDER.length, challengesDone: 0, byDiff: { Easy: [0, 0], Medium: [0, 0], Hard: [0, 0] } };
    LESSON_ORDER.forEach(function (l) { if (lessonStats(l).complete) t.lessonsDone++; });
    EXERCISE_ORDER.forEach(function (id) { if (isSolved(id)) t.exercisesDone++; });
    CHALLENGE_ORDER.forEach(function (id) {
      var d = PROBLEMS[id].difficulty;
      t.byDiff[d][1]++;
      if (isSolved(id)) { t.challengesDone++; t.byDiff[d][0]++; }
    });
    return t;
  }

  function nextStep() {
    for (var i = 0; i < MODULES.length; i++) {
      var m = MODULES[i];
      for (var j = 0; j < m.lessons.length; j++) {
        var l = m.lessons[j];
        if (!Store.d.visited[l.id]) return { kind: "lesson", lesson: l, module: m };
        var ex = l.exercises.filter(function (id) { return !isSolved(id); })[0];
        if (ex) return { kind: "exercise", problem: PROBLEMS[ex], lesson: l, module: m };
      }
      var ch = m.challenges.filter(function (id) { return !isSolved(id); })[0];
      if (ch) return { kind: "challenge", problem: PROBLEMS[ch], module: m };
    }
    return null;
  }

  function dayKey(date) {
    var d = date || new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  function streak() {
    var count = 0;
    var d = new Date();
    if (!Store.d.activity[dayKey(d)]) d.setDate(d.getDate() - 1);
    while (Store.d.activity[dayKey(d)]) { count++; d.setDate(d.getDate() - 1); }
    return count;
  }

  // -------------------------------------------------------------------------
  // Small helpers
  // -------------------------------------------------------------------------

  var ICON = {
    solved: '<svg viewBox="0 0 20 20" aria-label="Solved"><circle cx="10" cy="10" r="8.5" fill="currentColor"/><path d="M6 10.4l2.6 2.6L14.2 7.4" fill="none" stroke="var(--surface)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    attempted: '<svg viewBox="0 0 20 20" aria-label="Attempted"><circle cx="10" cy="10" r="7.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 2.5a7.5 7.5 0 0 1 0 15z" fill="currentColor"/></svg>',
    todo: '<svg viewBox="0 0 20 20" aria-label="Not started"><circle cx="10" cy="10" r="7.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>',
    lock: '<svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>',
    play: '<svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg>',
    left: '<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M10 3L5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    right: '<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  };

  function statusIcon(status) {
    return '<span class="status-icon st-' + status + '">' + ICON[status] + "</span>";
  }
  function diffLabel(d) { return '<span class="diff diff-' + d + '">' + d + "</span>"; }
  function pad2(n) { return String(n).padStart(2, "0"); }
  function timeAgo(ts) {
    var s = (Date.now() - ts) / 1000;
    if (s < 60) return "just now";
    if (s < 3600) return Math.floor(s / 60) + " min ago";
    if (s < 86400) return Math.floor(s / 3600) + " h ago";
    var days = Math.floor(s / 86400);
    return days === 1 ? "yesterday" : days + " days ago";
  }
  function problemTitle(p) { return p.kind === "challenge" ? p.number + ". " + p.title : p.title; }
  function isMac() { return /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent); }
  var MOD = isMac() ? "⌘" : "Ctrl";

  var toastTimer = null;
  function toast(msg) {
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.hidden = true; }, 2800);
  }

  function debounce(fn, ms) {
    var t = null;
    return function () {
      var args = arguments;
      clearTimeout(t);
      t = setTimeout(function () { fn.apply(null, args); }, ms);
    };
  }

  function makeEditor(host, value, extra) {
    var tabToSpaces = function (cm) {
      if (cm.somethingSelected()) { cm.indentSelection("add"); return; }
      var col = cm.getCursor().ch;
      cm.replaceSelection(" ".repeat(4 - (col % 4)), "end");
    };
    var keys = {
      Tab: tabToSpaces,
      "Shift-Tab": function (cm) { cm.indentSelection("subtract"); },
      "Cmd-/": "toggleComment",
      "Ctrl-/": "toggleComment",
    };
    Object.assign(keys, (extra && extra.keys) || {});
    return CodeMirror(host, Object.assign({
      value: value,
      mode: { name: "python", version: 3, singleLineStringErrors: false },
      lineNumbers: true,
      indentUnit: 4,
      tabSize: 4,
      indentWithTabs: false,
      matchBrackets: true,
      autoCloseBrackets: true,
      extraKeys: keys,
    }, (extra && extra.options) || {}));
  }

  // -------------------------------------------------------------------------
  // Python runtime
  // -------------------------------------------------------------------------

  var runner = new PyRunner(window.PYFORGE_HARNESS);
  var pill = document.getElementById("runtime-pill");
  var PILL_TEXT = { idle: "Python idle", loading: "Starting Python…", ready: "Python ready", busy: "Running…", error: "Python unavailable" };
  runner.onState(function (state, detail) {
    pill.dataset.state = state;
    pill.querySelector(".label").textContent = PILL_TEXT[state] || state;
    pill.title = detail || "Python runs in your browser using Pyodide";
  });

  // -------------------------------------------------------------------------
  // Theme
  // -------------------------------------------------------------------------

  function applyTheme() {
    if (Store.d.theme) document.documentElement.setAttribute("data-theme", Store.d.theme);
    else document.documentElement.removeAttribute("data-theme");
  }
  applyTheme();
  document.getElementById("theme-toggle").addEventListener("click", function () {
    var current = Store.d.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    Store.d.theme = current === "dark" ? "light" : "dark";
    Store.save();
    applyTheme();
  });

  // -------------------------------------------------------------------------
  // Router
  // -------------------------------------------------------------------------

  var currentView = null;

  function route() {
    if (currentView && currentView.destroy) currentView.destroy();
    currentView = null;
    app.classList.remove("app-fixed");
    var hash = location.hash.replace(/^#\/?/, "");
    var parts = hash.split("/");
    var navKey = "learn";
    if (parts[0] === "lesson" && parts[1]) {
      currentView = viewLesson(decodeURIComponent(parts[1]));
    } else if (parts[0] === "problem" && parts[1]) {
      var p = PROBLEMS[decodeURIComponent(parts[1])];
      navKey = p && p.kind === "exercise" ? "learn" : "problems";
      currentView = viewProblem(decodeURIComponent(parts[1]));
    } else if (parts[0] === "problems") {
      navKey = "problems";
      currentView = viewProblems();
    } else if (parts[0] === "progress") {
      navKey = "progress";
      currentView = viewProgress();
    } else {
      currentView = viewLearn();
    }
    document.querySelectorAll(".nav a").forEach(function (a) {
      a.classList.toggle("active", a.dataset.nav === navKey);
    });
    app.scrollTop = 0;
  }
  window.addEventListener("hashchange", route);

  function notFound(what) {
    app.innerHTML = '<div class="page"><h1>Not found</h1><p class="muted">That ' + what +
      ' doesn\'t exist. It may have been renamed.</p><p><a class="btn" href="#/">Back to the learning path</a></p></div>';
    return null;
  }

  // -------------------------------------------------------------------------
  // Learn (home)
  // -------------------------------------------------------------------------

  function viewLearn() {
    var t = totals();
    var next = nextStep();
    var nextHtml;
    if (!next) {
      nextHtml = '<span class="eyebrow">All done</span><h2>You finished every lesson and challenge.</h2>' +
        '<p class="muted">Revisit the Hard problems, or try solving earlier ones a different way.</p>' +
        '<a class="btn btn-primary" href="#/problems">Browse problems</a>';
    } else if (next.kind === "lesson") {
      nextHtml = '<span class="eyebrow">Up next · Module ' + next.module.number + "</span><h2>" + esc(next.lesson.title) + "</h2>" +
        '<p class="muted" style="margin:0">' + esc(next.lesson.summary) + "</p>" +
        '<a class="btn btn-primary" href="#/lesson/' + next.lesson.id + '">Start lesson</a>';
    } else if (next.kind === "exercise") {
      nextHtml = '<span class="eyebrow">Up next · Practice</span><h2>' + esc(next.problem.title) + "</h2>" +
        '<p class="muted" style="margin:0">An exercise from “' + esc(next.lesson.title) + "”.</p>" +
        '<a class="btn btn-primary" href="#/problem/' + next.problem.id + '">Solve exercise</a>';
    } else {
      nextHtml = '<span class="eyebrow">Up next · ' + esc(next.module.challenge_title) + "</span><h2>" + esc(problemTitle(next.problem)) + "</h2>" +
        '<p class="muted" style="margin:0">' + diffLabel(next.problem.difficulty) + " · combines " + esc(next.problem.tags.slice(0, 3).join(", ")) + "</p>" +
        '<a class="btn btn-primary" href="#/problem/' + next.problem.id + '">Take the challenge</a>';
    }

    var html = '<div class="page">' +
      '<section class="welcome"><div class="welcome-main">' +
      '<span class="eyebrow">Python practice · runs in your browser</span>' +
      "<h1>Learn a technique, try it yourself, then prove it.</h1>" +
      "<p>Every lesson walks through a skill with examples you can run and edit, then hands you exercises to solve. " +
      "Each module ends with a checkpoint: LeetCode-style problems that combine everything so far, judged against hidden tests.</p>" +
      '<div class="stat-row">' +
      '<div class="stat"><b>' + t.lessonsDone + "/" + t.lessons + "</b><span>lessons complete</span></div>" +
      '<div class="stat"><b>' + t.exercisesDone + "/" + t.exercises + "</b><span>exercises solved</span></div>" +
      '<div class="stat"><b>' + t.challengesDone + "/" + t.challenges + "</b><span>challenges solved</span></div>" +
      "</div></div>" +
      '<aside class="continue-card">' + nextHtml + "</aside></section>" +
      '<div class="path">' + MODULES.map(renderModule).join("") + "</div></div>";
    app.innerHTML = html;
    return null;
  }

  function renderModule(m) {
    var s = moduleStats(m);
    var lessons = m.lessons.map(function (l) {
      var ls = lessonStats(l);
      var dots = l.exercises.map(function (id) { return "<i" + (isSolved(id) ? ' class="on"' : "") + "></i>"; }).join("");
      return '<li><a class="lesson-row" href="#/lesson/' + l.id + '">' + statusIcon(lessonStatus(l)) +
        '<span><span class="title">' + esc(l.title) + '</span><span class="summary">' + esc(l.summary) + "</span></span>" +
        '<span class="ex-dots" title="Exercises solved">' + dots + "<small>" + ls.done + "/" + ls.total + "</small></span></a></li>";
    }).join("");
    var cps = m.challenges.map(function (id) {
      var p = PROBLEMS[id];
      return '<a class="cp-item" href="#/problem/' + id + '">' + statusIcon(problemStatus(id)) +
        "<span>" + esc(problemTitle(p)) + "</span>" + diffLabel(p.difficulty) + "</a>";
    }).join("");
    var note = s.lessonsDone < s.lessons ? "Best tackled after this module's lessons" : s.chSolved === s.challenges ? "Checkpoint cleared" : "You're ready for this";
    return '<section class="module' + (s.complete ? " done" : "") + '" id="module-' + m.id + '">' +
      '<div class="module-num">' + pad2(m.number) + "</div><div>" +
      '<div class="module-head"><h2>' + esc(m.title) + '</h2><span class="muted">' + s.lessonsDone + "/" + s.lessons +
      " lessons · " + s.chSolved + "/" + s.challenges + " challenges</span></div>" +
      '<p class="module-blurb">' + esc(m.blurb) + "</p>" +
      '<ol class="lesson-list">' + lessons + "</ol>" +
      '<div class="checkpoint"><div class="checkpoint-head"><h3>' + esc(m.challenge_title) + '</h3><span class="cp-note">' + note + "</span></div>" +
      "<p>" + esc(m.challenge_blurb) + '</p><div class="checkpoint-list">' + cps + "</div></div>" +
      "</div></section>";
  }

  // -------------------------------------------------------------------------
  // Lesson reader
  // -------------------------------------------------------------------------

  function viewLesson(id) {
    var L = LESSONS[id];
    if (!L) return notFound("lesson");
    Store.d.visited[id] = Store.d.visited[id] || Date.now();
    Store.save();
    runner.start();

    var m = L.module;
    var headings = [];
    var examples = [];
    var body = MD.render(L.body, {
      onHeading: function (level, text, hid) { if (level === 2) headings.push({ text: text, id: hid }); },
      onPython: function (code) {
        var i = examples.length;
        examples.push(code);
        return '<div class="example" data-ex="' + i + '"><div class="example-bar"><span class="label">example ' + (i + 1) + "</span>" +
          '<button class="btn btn-sm btn-ghost" type="button" data-act="reset" hidden>Reset</button>' +
          '<button class="btn btn-sm btn-primary" type="button" data-act="run" title="Run (' + MOD + ' + Enter)">' + ICON.play + " Run</button></div>" +
          '<div class="example-editor"></div><pre class="example-out" hidden></pre></div>';
      },
    });

    var pos = LESSON_ORDER.indexOf(L);
    var prev = LESSON_ORDER[pos - 1];
    var next = LESSON_ORDER[pos + 1];
    var lastInModule = L.index === m.lessons.length - 1;

    var side = '<aside class="lesson-side"><h4>Module ' + m.number + " · " + esc(m.title) + "</h4><ol>" +
      m.lessons.map(function (l) {
        return '<li><a href="#/lesson/' + l.id + '"' + (l.id === id ? ' class="current"' : "") + ">" + statusIcon(lessonStatus(l)) +
          "<span>" + esc(l.title) + "</span></a></li>";
      }).join("") +
      '<li><a href="#/problem/' + m.challenges[0] + '">' + statusIcon(moduleStats(m).chSolved === m.challenges.length ? "solved" : "todo") +
      "<span>Checkpoint " + m.number + "</span></a></li></ol>" +
      (headings.length ? '<h4>On this page</h4><ul class="toc">' + headings.map(function (h) {
        return '<li><a href="#/lesson/' + id + '" data-scroll="' + h.id + '">' + esc(h.text) + "</a></li>";
      }).join("") + '<li><a href="#/lesson/' + id + '" data-scroll="practice">Your turn</a></li></ul>' : "") +
      "</aside>";

    var practice = '<section class="practice" id="practice"><span class="eyebrow">Your turn</span><h2>Practice exercises</h2>' +
      "<p>Solve these to complete the lesson. Each one opens in the editor with examples, hidden tests and hints.</p>" +
      '<div class="practice-grid">' + L.exercises.map(function (pid, i) {
        var p = PROBLEMS[pid];
        return '<a class="practice-card" href="#/problem/' + pid + '"><div class="top"><span class="eyebrow">Exercise ' + (i + 1) +
          "</span>" + statusIcon(problemStatus(pid)) + "</div><h3>" + esc(p.title) + "</h3><p>" +
          esc(p.description.split("\n")[0].replace(/[`*]/g, "").slice(0, 110)) + "…</p></a>";
      }).join("") + "</div>" +
      '<nav class="lesson-nav">' +
      (prev ? '<a class="btn" href="#/lesson/' + prev.id + '">' + ICON.left + " " + esc(prev.title) + "</a>" : "<span></span>") +
      (lastInModule ? '<a class="btn btn-primary" href="#/problem/' + m.challenges[0] + '">Checkpoint ' + m.number + " " + ICON.right + "</a>"

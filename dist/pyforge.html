/* PyForge styles ---------------------------------------------------------
   Palette: cool slate neutrals with a slate-blue accent and a mustard "spark"
   (a nod to Python's colours without copying them). Difficulty colours are
   semantic and independent of the accent. */

:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --surface-2: #eef1f5;
  --surface-3: #e2e7ee;
  --line: #d8dee6;
  --line-strong: #c2cad5;
  --ink: #131a24;
  --ink-2: #3a4556;
  --muted: #677386;
  --accent: #2c5a88;
  --accent-hover: #234a71;
  --accent-ink: #ffffff;
  --accent-soft: #e1eaf4;
  --spark: #d99c12;
  --spark-soft: #fbf1d8;
  --easy: #0f8f77;
  --medium: #b97705;
  --hard: #cc3653;
  --practice: #5a6b85;
  --ok: #1d8548;
  --ok-hover: #176b3a;
  --ok-soft: #e2f3e9;
  --bad: #c3352f;
  --bad-soft: #fbe8e6;
  --warn-soft: #fcf3dc;
  --code-bg: #f6f8fb;
  --syn-kw: #8a3fb8;
  --syn-def: #1f5fa8;
  --syn-str: #1a7a4c;
  --syn-num: #b4570b;
  --syn-com: #7c8797;
  --syn-builtin: #0f7a8a;
  --syn-op: #4a5566;
  --shadow: 0 1px 2px rgba(19, 26, 36, 0.06), 0 4px 16px rgba(19, 26, 36, 0.06);
  --radius: 10px;
  --radius-sm: 6px;
  --font-display: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --topbar-h: 52px;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1219;
    --surface: #141b25;
    --surface-2: #1a2330;
    --surface-3: #222d3b;
    --line: #283343;
    --line-strong: #364457;
    --ink: #e4e9f0;
    --ink-2: #b8c2cf;
    --muted: #8290a3;
    --accent: #80b1e6;
    --accent-hover: #a3c7ee;
    --accent-ink: #0d1219;
    --accent-soft: #1b2b3e;
    --spark: #f0c24b;
    --spark-soft: #2e2713;
    --easy: #2cc3a2;
    --medium: #f0b240;
    --hard: #ff6c86;
    --practice: #93a3bb;
    --ok: #46c27a;
    --ok-hover: #62d391;
    --ok-soft: #14281c;
    --bad: #ff6f66;
    --bad-soft: #2e1715;
    --warn-soft: #2b2412;
    --code-bg: #10161f;
    --syn-kw: #cf8ef5;
    --syn-def: #7fb6f2;
    --syn-str: #8fd19e;
    --syn-num: #f2a86b;
    --syn-com: #6d7a8c;
    --syn-builtin: #6fd0dc;
    --syn-op: #aab4c2;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 20px rgba(0, 0, 0, 0.25);
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #0d1219;
  --surface: #141b25;
  --surface-2: #1a2330;
  --surface-3: #222d3b;
  --line: #283343;
  --line-strong: #364457;
  --ink: #e4e9f0;
  --ink-2: #b8c2cf;
  --muted: #8290a3;
  --accent: #80b1e6;
  --accent-hover: #a3c7ee;
  --accent-ink: #0d1219;
  --accent-soft: #1b2b3e;
  --spark: #f0c24b;
  --spark-soft: #2e2713;
  --easy: #2cc3a2;
  --medium: #f0b240;
  --hard: #ff6c86;
  --practice: #93a3bb;
  --ok: #46c27a;
  --ok-hover: #62d391;
  --ok-soft: #14281c;
  --bad: #ff6f66;
  --bad-soft: #2e1715;
  --warn-soft: #2b2412;
  --code-bg: #10161f;
  --syn-kw: #cf8ef5;
  --syn-def: #7fb6f2;
  --syn-str: #8fd19e;
  --syn-num: #f2a86b;
  --syn-com: #6d7a8c;
  --syn-builtin: #6fd0dc;
  --syn-op: #aab4c2;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 20px rgba(0, 0, 0, 0.25);
  color-scheme: dark;
}

/* Base ------------------------------------------------------------------- */

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.6 var(--font-body);
  -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.2; text-wrap: balance; margin: 0; }
code, pre, kbd { font-family: var(--font-mono); }
img { max-width: 100%; }

.shell { display: flex; flex-direction: column; height: 100%; }
#app { flex: 1; min-height: 0; overflow: auto; outline: none; }
#app.app-fixed { overflow: hidden; }

/* Top bar ---------------------------------------------------------------- */

.topbar {
  display: flex;
  align-items: center;
  gap: 24px;
  height: var(--topbar-h);
  padding: 0 20px;
  padding-top: env(safe-area-inset-top, 0px);
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  flex-shrink: 0;
}
.brand { display: flex; align-items: baseline; gap: 8px; color: var(--ink); }
.brand:hover { text-decoration: none; }
.brand-prompt { font: 700 13px var(--font-mono); color: var(--spark); letter-spacing: -0.02em; }
.brand-name { font: 800 19px var(--font-display); letter-spacing: -0.02em; }
.nav { display: flex; gap: 4px; }
.nav a {
  padding: 6px 12px;
  border-radius: var(--radius-sm);
  color: var(--ink-2);
  font-weight: 500;
  font-size: 14px;
}
.nav a:hover { background: var(--surface-2); text-decoration: none; }
.nav a.active { color: var(--ink); background: var(--surface-2); }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

.runtime-pill {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 12px; color: var(--muted);
  padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px;
  white-space: nowrap;
}
.runtime-pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line-strong); }
.runtime-pill[data-state="loading"] .dot { background: var(--spark); animation: pulse 1s ease-in-out infinite; }
.runtime-pill[data-state="busy"] .dot { background: var(--accent); animation: pulse 0.8s ease-in-out infinite; }
.runtime-pill[data-state="ready"] .dot { background: var(--ok); }
.runtime-pill[data-state="error"] .dot { background: var(--bad); }
@keyframes pulse { 50% { opacity: 0.3; } }

.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 34px; height: 34px; border-radius: var(--radius-sm);
  border: 1px solid transparent; background: transparent; color: var(--ink-2); cursor: pointer;
}
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }

/* Buttons ---------------------------------------------------------------- */

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 34px; padding: 0 14px;
  border-radius: var(--radius-sm); border: 1px solid var(--line-strong);
  background: var(--surface); color: var(--ink);
  font-weight: 500; font-size: 14px; cursor: pointer; white-space: nowrap;
}
.btn:hover { background: var(--surface-2); text-decoration: none; }
.btn:disabled { opacity: 0.55; cursor: not-allowed; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn-submit { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn-submit:hover { background: var(--ok-hover); border-color: var(--ok-hover); }
:root[data-theme="dark"] .btn-submit { color: #0d1219; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn-submit { color: #0d1219; } }
.btn-ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn-ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn-sm { height: 28px; padding: 0 10px; font-size: 13px; }
.btn kbd { font-size: 11px; opacity: 0.7; }

/* Shared bits ------------------------------------------------------------ */

.page { max-width: 1120px; margin: 0 auto; padding: 32px 20px 64px; }
.eyebrow {
  font: 600 12px var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
}
.muted { color: var(--muted); }
.diff { font-weight: 600; font-size: 13px; }
.diff-Easy { color: var(--easy); }
.diff-Medium { color: var(--medium); }
.diff-Hard { color: var(--hard); }
.diff-Practice { color: var(--practice); }
.pill {
  display: inline-flex; align-items: center; height: 24px; padding: 0 10px;
  border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--ink-2);
}
.pill.diff-Easy { background: color-mix(in srgb, var(--easy) 14%, transparent); }
.pill.diff-Medium { background: color-mix(in srgb, var(--medium) 16%, transparent); }
.pill.diff-Hard { background: color-mix(in srgb, var(--hard) 14%, transparent); }
.chip {
  display: inline-flex; align-items: center; height: 22px; padding: 0 8px;
  border-radius: var(--radius-sm); font-size: 12px; background: var(--surface-2); color: var(--ink-2);
  white-space: nowrap;
}
.status-icon { display: inline-flex; width: 18px; height: 18px; flex-shrink: 0; }
.status-icon svg { width: 18px; height: 18px; }
.st-solved { color: var(--ok); }
.st-attempted { color: var(--spark); }
.st-todo { color: var(--line-strong); }
.bar { height: 6px; background: var(--surface-3); border-radius: 999px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.bar.ok > span { background: var(--ok); }

.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: var(--radius-sm);
  font-size: 14px; box-shadow: var(--shadow); z-index: 50; max-width: calc(100% - 32px);
}

/* Learn (home) ----------------------------------------------------------- */

.welcome {
  display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 20px; margin-bottom: 40px;
}
.welcome-main h1 { font-size: clamp(28px, 4vw, 40px); font-weight: 800; letter-spacing: -0.03em; margin: 8px 0 12px; }
.welcome-main p { color: var(--ink-2); max-width: 60ch; margin: 0 0 20px; }
.continue-card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 20px; display: flex; flex-direction: column; gap: 14px; box-shadow: var(--shadow);
}
.continue-card h2 { font-size: 20px; }
.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat b { font: 700 22px var(--font-display); font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }

.path { display: flex; flex-direction: column; gap: 28px; }
.module {
  display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 20px;
}
.module-num {
  font: 800 34px/1 var(--font-display); color: var(--line-strong); letter-spacing: -0.04em;
  padding-top: 4px; font-variant-numeric: tabular-nums;
}
.module.done .module-num { color: var(--ok); }
.module-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.module-head h2 { font-size: 22px; letter-spacing: -0.01em; }
.module-head .muted { font-size: 13px; font-variant-numeric: tabular-nums; }
.module-blurb { color: var(--ink-2); margin: 4px 0 14px; max-width: 70ch; }
.lesson-list { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
.lesson-row {
  display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 12px; align-items: center;
  padding: 12px 16px; color: var(--ink);
}
.lesson-list li + li .lesson-row { border-top: 1px solid var(--line); }
.lesson-row:hover { background: var(--surface-2); text-decoration: none; }
.lesson-row .title { font-weight: 500; }
.lesson-row .summary { font-size: 13px; color: var(--muted); display: block; }
.ex-dots { display: flex; gap: 4px; align-items: center; }
.ex-dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--surface-3); border: 1px solid var(--line-strong); }
.ex-dots i.on { background: var(--ok); border-color: var(--ok); }
.ex-dots small { font-size: 12px; color: var(--muted); margin-left: 6px; font-variant-numeric: tabular-nums; }

.checkpoint {
  margin-top: 12px; border: 1px dashed var(--line-strong); border-radius: var(--radius); padding: 14px 16px;
  background: linear-gradient(90deg, var(--spark-soft), transparent 60%);
}
.checkpoint-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.checkpoint-head h3 { font-size: 16px; display: flex; align-items: center; gap: 8px; }
.checkpoint-head h3::before { content: "◆"; color: var(--spark); font-size: 12px; }
.checkpoint p { margin: 4px 0 10px; font-size: 14px; color: var(--ink-2); }
.checkpoint-list { display: flex; flex-wrap: wrap; gap: 8px; }
.cp-item {
  display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: var(--radius-sm);
  background: var(--surface); border: 1px solid var(--line); color: var(--ink); font-size: 14px;
}
.cp-item:hover { border-color: var(--line-strong); text-decoration: none; }
.cp-item .diff { font-size: 12px; }
.cp-note { font-size: 12px; color: var(--muted); }

/* Lesson reader ---------------------------------------------------------- */

.lesson-layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 40px; max-width: 1080px; margin: 0 auto; padding: 32px 20px 80px; }
.lesson-side { position: sticky; top: 16px; align-self: start; font-size: 14px; }
.lesson-side h4 { font: 600 12px var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.lesson-side ol, .lesson-side ul { list-style: none; margin: 0 0 24px; padding: 0; }
.lesson-side li a { display: flex; gap: 8px; align-items: center; padding: 5px 8px; border-radius: var(--radius-sm); color: var(--ink-2); }
.lesson-side li a:hover { background: var(--surface-2); text-decoration: none; }
.lesson-side li a.current { background: var(--accent-soft); color: var(--ink); font-weight: 500; }
.lesson-side .toc a { font-size: 13px; color: var(--muted); }
.lesson-main { max-width: 740px; min-width: 0; }
.lesson-main > header h1 { font-size: clamp(28px, 4vw, 38px); font-weight: 800; letter-spacing: -0.025em; margin: 6px 0 8px; }
.lesson-main > header p { color: var(--ink-2); margin: 0; font-size: 17px; }
.lesson-main > header .meta { margin-top: 10px; font-size: 13px; color: var(--muted); }

window.PYFORGE_CONTENT = {"modules":[{"id":"foundations","number":1,"title":"Python Foundations","blurb":"Variables, strings, loops and functions: the building blocks of every program.","lessons":[{"id":"variables","title":"Variables, Numbers & Operators","summary":"Store values in names, do arithmetic, and compare things.","body":"Every program works with **values**: numbers, text, true/false. A **variable** is a name that points at a value so you can use it again later.\n\n```python\nlanguage = \"Python\"\nyear = 1991\nversion = 3.13\nprint(language, \"first appeared in\", year)\nprint(type(year), type(version), type(language))\n```\n\nPython works out the type from the value itself, so you never declare it. Press **Run** on any example to execute it, and edit it freely to experiment.\n\n## Numbers and arithmetic\n\nPython has two everyday number types: `int` for whole numbers (with no size limit) and `float` for decimals.\n\n| Operator | Meaning | Example | Result |\n|---|---|---|---|\n| `+` `-` `*` | add, subtract, multiply | `7 * 3` | `21` |\n| `/` | true division, always gives a float | `7 / 2` | `3.5` |\n| `//` | floor division | `7 // 2` | `3` |\n| `%` | remainder (modulo) | `7 % 2` | `1` |\n| `**` | power | `2 ** 10` | `1024` |\n\n```python\nprint(7 / 2, 7 // 2, 7 % 2)\nprint(2 ** 100)          # ints grow as big as you need\nprint(-7 // 2, -7 % 2)   # floor division rounds DOWN, towards -infinity\n```\n\n`//` and `%` work as a pair. For any `a` and positive `b`, `a == (a // b) * b + a % b`. Together they split a number into \"how many whole groups\" and \"what's left over\", which comes up constantly:\n\n```python\ntotal_minutes = 135\nhours = total_minutes // 60\nminutes = total_minutes % 60\nprint(hours, \"h\", minutes, \"min\")\n\nn = 4827\nprint(\"last digit:\", n % 10)\nprint(\"without last digit:\", n // 10)\n```\n\n## Updating variables\n\n```python\nscore = 10\nscore += 5      # same as score = score + 5\nscore *= 2\nprint(score)\n\na, b = 1, 2     # assign two names at once\na, b = b, a     # swap without a temporary variable\nprint(a, b)\n```\n\n## Comparisons and booleans\n\nComparisons produce `True` or `False` (type `bool`). Combine them with `and`, `or` and `not`. Python lets you chain comparisons the way you would in maths.\n\n```python\nx = 42\nprint(x > 10, x == 42, x != 42)\nprint(0 <= x < 100)              # chained: 0 <= x and x < 100\nprint(x % 2 == 0 and x > 40)\nprint(not (x > 50))\n```\n\n`and` and `or` **short-circuit**: `and` stops at the first false value, `or` stops at the first true one. That lets you guard a risky check. `count > 0 and total / count > 5` never divides by zero.\n\n## Converting between types\n\n```python\nprint(int(\"42\") + 1)       # text to number\nprint(str(42) + \"!\")       # number to text\nprint(int(3.99))           # int() truncates toward zero\nprint(round(3.567, 2))     # round to 2 decimal places\nprint(abs(-8), min(4, 9, 2), max(4, 9, 2))\n```\n\n## How exercises work\n\nEach exercise gives you a **function** to complete. The function receives its inputs as parameters, and you `return` the answer rather than printing it. Functions get a full lesson later in this module; for now, write your code inside the indented block:\n\n```python\ndef area_of_rectangle(width, height):\n    return width * height\n\nprint(area_of_rectangle(3, 4))\n```\n\n**Run** checks your code against the examples. **Submit** also runs the hidden tests, which include edge cases and large inputs.\n\n> **Key idea:** `//` gives the whole groups and `%` gives the leftover. Use them to pull numbers apart.","minutes":15,"exercises":["split-time","leap-year"],"setup":null},{"id":"strings","title":"Strings","summary":"Index, slice, search and format text.","body":"A **string** is a sequence of characters. Use single or double quotes; they behave identically.\n\n## Indexing and slicing\n\nEach character has a position, starting at `0`. Negative indexes count from the end.\n\n```text\n p   y   t   h   o   n\n 0   1   2   3   4   5\n-6  -5  -4  -3  -2  -1\n```\n\n```python\nword = \"python\"\nprint(len(word))\nprint(word[0], word[-1])      # first and last characters\nprint(word[1:4])              # 'yth': start included, stop excluded\nprint(word[:2], word[2:])     # omit start or stop to go to the edge\nprint(word[::-1])             # step -1 reverses\nprint(word[::2])              # every second character\n```\n\nA slice `s[start:stop:step]` never raises an error for out-of-range bounds; it just clips. Indexing a single position that doesn't exist does raise `IndexError`.\n\n## Strings are immutable\n\nYou can't change a character in place. Build a new string instead:\n\n```python\nword = \"python\"\n# word[0] = \"P\" would raise TypeError\nword = \"P\" + word[1:]\nprint(word)\n```\n\n## Useful methods\n\n| Method | What it does |\n|---|---|\n| `s.lower()`, `s.upper()`, `s.capitalize()` | change case |\n| `s.strip()` | remove whitespace from both ends |\n| `s.split()` / `s.split(sep)` | break into a list of pieces |\n| `sep.join(pieces)` | glue pieces together with `sep` between them |\n| `s.replace(old, new)` | replace every occurrence |\n| `s.find(sub)` | index of the first match, or `-1` |\n| `s.count(sub)` | number of non-overlapping matches |\n| `s.startswith(p)`, `s.endswith(p)` | prefix / suffix tests |\n| `s.isdigit()`, `s.isalpha()`, `s.isalnum()` | character-class tests |\n\n```python\nline = \"   Hello, World!  \"\nclean = line.strip()\nprint(clean.lower(), clean.upper())\nprint(clean.split(\", \"))\nprint(\"-\".join([\"2026\", \"09\", \"25\"]))\nprint(clean.replace(\"World\", \"Python\"))\nprint(clean.find(\"World\"), clean.find(\"xyz\"))\nprint(\"banana\".count(\"a\"), \"42\".isdigit(), \"abc1\".isalpha())\n```\n\n`split()` with no argument splits on any run of whitespace and ignores leading and trailing spaces, which is usually what you want for messy input:\n\n```python\nprint(\"  too    many   spaces \".split())\n```\n\n## f-strings\n\nPut `f` before the quotes and write expressions inside `{}`. A format spec after `:` controls the layout.\n\n```python\nname, score = \"Ada\", 93.456\nprint(f\"{name} scored {score:.1f}%\")\nprint(f\"[{name:>8}]\")      # right-align in 8 characters\nprint(f\"{7:03d}\")           # pad with zeros\nprint(f\"{2 + 3 = }\")        # '=' shows the expression too, handy for debugging\n```\n\n## Characters and codes\n\n`in` tests for a substring. `ord()` turns a character into its code number and `chr()` goes back. Looping over a string (next lesson) visits one character at a time.\n\n```python\nprint(\"py\" in \"python\", \"z\" not in \"python\")\nprint(ord(\"a\"), ord(\"b\"), ord(\"A\"))\nprint(chr(ord(\"a\") + 2))\nprint(ord(\"e\") - ord(\"a\"))    # position in the alphabet, from 0\n```\n\n> **Key idea:** `s[::-1]` reverses, `split()`/`join()` convert between strings and lists, and f-strings handle formatting.","minutes":20,"exercises":["palindrome-word","format-name"],"setup":null},{"id":"control-flow","title":"Conditionals & Loops","summary":"Make decisions with if, and repeat work with for and while.","body":"## if / elif / else\n\nPython uses **indentation** (4 spaces) to mark which lines belong to a block. The first condition that's true wins, and the rest are skipped.\n\n```python\ntemperature = 23\nif temperature > 30:\n    print(\"hot\")\nelif temperature > 15:\n    print(\"pleasant\")\nelse:\n    print(\"cold\")\n```\n\nAny value can be used as a condition. `0`, `0.0`, `\"\"` (empty string), `None` and empty collections are **falsy**; almost everything else is **truthy**.\n\n```python\nname = \"\"\nif name:\n    print(\"Hello,\", name)\nelse:\n    print(\"No name given\")\n```\n\n## for loops and range\n\n`for` visits each item of a sequence in turn. `range(stop)`, `range(start, stop)` and `range(start, stop, step)` produce integers, and `stop` is **never included**.\n\n```python\nfor i in range(5):\n    print(i, end=\" \")\nprint()\nfor i in range(2, 11, 2):\n    print(i, end=\" \")\nprint()\nfor i in range(5, 0, -1):\n    print(i, end=\" \")\nprint()\nfor ch in \"hey\":\n    print(ch.upper(), end=\"\")\n```\n\n## The accumulator pattern\n\nStart a variable at a neutral value, then update it inside the loop. This single pattern solves a huge number of problems.\n\n```python\ntotal = 0\nfor n in range(1, 101):\n    total += n\nprint(\"1 + 2 + ... + 100 =\", total)\n\nvowels = 0\nfor ch in \"programming in python\":\n    if ch in \"aeiou\":\n        vowels += 1\nprint(\"vowels:\", vowels)\n\nlongest_run = run = 0\nfor ch in \"aabbbbcdd\":\n    run = run + 1 if ch == \"b\" else 0\n    longest_run = max(longest_run, run)\nprint(\"longest run of b:\", longest_run)\n```\n\n## while loops\n\nUse `while` when you don't know in advance how many steps you need. Make sure something inside changes so the condition eventually becomes false, otherwise the loop never ends. (PyForge stops code that runs too long with **Time Limit Exceeded**.)\n\n```python\nn = 1\nwhile n < 1000:\n    n *= 2\nprint(n)   # first power of two that is >= 1000\n\nn = 90210\ndigits = 0\nwhile n > 0:\n    n //= 10       # chop off the last digit\n    digits += 1\nprint(\"digits:\", digits)\n```\n\n## break and continue\n\n`break` leaves the loop immediately. `continue` skips to the next iteration.\n\n```python\nfor n in range(2, 50):\n    if n % 7 == 0:\n        print(\"first multiple of 7:\", n)\n        break\n\nfor n in range(10):\n    if n % 3 == 0:\n        continue\n    print(n, end=\" \")\n```\n\n## Nested loops\n\nA loop inside a loop runs the inner loop fully for **each** outer iteration. That's `rows × cols` steps in total, and this multiplication is where slow code usually comes from.\n\n```python\nfor row in range(1, 4):\n    line = \"\"\n    for col in range(1, 5):\n        line += f\"{row * col:4}\"\n    print(line)\n```\n\n> **Key idea:** most loop problems are \"walk through the input once, updating one or two variables as you go\".","minutes":20,"exercises":["digit-sum","collatz-steps"],"setup":null},{"id":"functions","title":"Functions","summary":"Package logic into reusable, testable pieces.","body":"A **function** takes inputs (parameters), does some work, and `return`s a result. Defining one with `def` doesn't run it; calling it does.\n\n```python\ndef greet(name, greeting=\"Hello\"):\n    return f\"{greeting}, {name}!\"\n\nprint(greet(\"Ada\"))\nprint(greet(\"Grace\", greeting=\"Welcome\"))   # keyword argument\n```\n\n`greeting=\"Hello\"` is a **default value**: callers can leave it out.\n\n## return vs print\n\n`return` hands a value back to the caller so it can be used in more code. `print` only shows text on screen. A function with no `return` gives back `None`.\n\n```python\ndef add(a, b):\n    return a + b\n\ndef shout(text):\n    print(text.upper())\n\nresult = add(2, 3) * 10\nprint(result)\nprint(shout(\"hi\"))    # prints HI, then None\n```\n\n## Returning several values\n\nReturn several values separated by commas. The caller can **unpack** them into separate names.\n\n```python\ndef min_max(a, b, c):\n    return min(a, b, c), max(a, b, c)\n\nlow, high = min_max(7, 2, 9)\nprint(low, high)\n```\n\n## Scope\n\nVariables assigned inside a function are **local**: they exist only while the function runs and don't affect names outside it.\n\n```python\ncount = 0\n\ndef bump():\n    count = 99        # a new local variable; the outer count is untouched\n    return count\n\nprint(bump(), count)\n```\n\n## Type hints\n\nStarter code in PyForge (and on LeetCode) uses **type hints** to document what goes in and out. Python doesn't enforce them.\n\n```python\nfrom typing import List\n\ndef average(nums: List[int]) -> float:\n    return sum(nums) / len(nums)\n\nprint(average([3, 4, 8]))\n```\n\n`List[int]` means \"a list of ints\", `Optional[int]` means \"an int or None\", and `-> bool` says the function returns a bool.\n\n## Functions are values\n\nYou can pass a function to another function. `lambda` writes a small one-expression function inline, and it's often used as a `key` for sorting.\n\n```python\ndef apply_twice(f, x):\n    return f(f(x))\n\nprint(apply_twice(lambda n: n * 3, 2))\n\nwords = [\"kiwi\", \"fig\", \"banana\"]\nprint(sorted(words, key=len))\n```\n\n## A classic trap: mutable defaults\n\nA default value is created **once**, when the function is defined. A list used as a default is shared between calls:\n\n```python\ndef add_item(item, basket=[]):\n    basket.append(item)\n    return basket\n\nprint(add_item(\"apple\"))\nprint(add_item(\"pear\"))            # surprise: ['apple', 'pear']\n\ndef add_item_fixed(item, basket=None):\n    if basket is None:\n        basket = []\n    basket.append(item)\n    return basket\n\nprint(add_item_fixed(\"apple\"), add_item_fixed(\"pear\"))\n```\n\n## Break problems into helpers\n\nSmall functions with clear names make code easier to read and test.\n\n```python\ndef is_vowel(ch):\n    return ch.lower() in \"aeiou\"\n\ndef count_vowels(text):\n    total = 0\n    for ch in text:\n        if is_vowel(ch):\n            total += 1\n    return total\n\nprint(count_vowels(\"Functions Keep Code Tidy\"))\n```\n\n> **Key idea:** a function should do one job, take everything it needs as parameters, and return its result.","minutes":20,"exercises":["is-prime","nth-prime"],"setup":null}],"challenges":["digit-mirror","clean-palindrome","spreadsheet-column","humble-number","capital-usage"],"challenge_title":"Checkpoint 1 · Foundations","challenge_blurb":"Five Easy problems that mix arithmetic, string handling, loops and functions."},{"id":"data-structures","number":2,"title":"Core Data Structures","blurb":"Lists, dictionaries, sets and tuples, plus the comprehensions and sorting that tie them together.","lessons":[{"id":"lists","title":"Lists","summary":"Ordered, changeable sequences and what their operations cost.","body":"A **list** is an ordered, changeable collection. It can hold anything, including other lists.\n\n```python\nprimes = [2, 3, 5, 7, 11]\nmixed = [1, \"two\", 3.0, [4, 5]]\nprint(len(primes), primes[0], primes[-1])\nprint(primes[1:3], primes[::-1])\nprint(7 in primes, 4 in primes)\nprint(mixed[3][0])\n```\n\nIndexing and slicing work exactly like strings. The difference is that lists are **mutable**: you can change them in place.\n\n## Changing a list\n\n```python\nnums = [3, 1, 4]\nnums.append(1)        # add to the end\nnums.extend([5, 9])   # add several\nnums.insert(0, 2)     # insert at index 0\nprint(nums)\nlast = nums.pop()     # remove and return the last item\nfirst = nums.pop(0)   # remove and return the item at index 0\nnums.remove(1)        # remove the first 1 (by value)\nnums[0] = 100         # replace by index\nprint(nums, last, first)\n```\n\n## Sorting and aggregates\n\n```python\nscores = [70, 95, 82, 61]\nprint(sorted(scores))           # a NEW sorted list; scores is unchanged\nprint(scores)\nscores.sort(reverse=True)       # sorts in place and returns None\nprint(scores)\nprint(sum(scores), min(scores), max(scores))\n```\n\n## Looping with enumerate and zip\n\n`enumerate` gives you the index alongside each item. `zip` walks several lists in step.\n\n```python\nfruits = [\"apple\", \"banana\", \"cherry\"]\nfor i, fruit in enumerate(fruits):\n    print(i, fruit)\n\nprices = [1.2, 0.5, 3.0]\nfor fruit, price in zip(fruits, prices):\n    print(f\"{fruit}: £{price:.2f}\")\n```\n\n## Building a list in a loop\n\n```python\nevens = []\nfor n in range(10):\n    if n % 2 == 0:\n        evens.append(n)\nprint(evens)\n\nrunning, total = [], 0\nfor x in [3, 1, 4, 1, 5]:\n    total += x\n    running.append(total)\nprint(running)\n```\n\n## Names are references\n\nAssigning a list to another name **doesn't copy it**. Both names point at the same list.\n\n```python\na = [1, 2, 3]\nb = a            # same list, two names\nb.append(4)\nprint(a)         # [1, 2, 3, 4]\nc = a[:]         # a real copy (list(a) and a.copy() work too)\nc.append(5)\nprint(a, c)\n```\n\nThis also applies to function arguments: a function that appends to a list parameter changes the caller's list.\n\n## Grids: lists of lists\n\n```python\ngrid = [[0] * 3 for _ in range(2)]   # 2 rows × 3 columns, each row separate\ngrid[0][1] = 7\nprint(grid)\n\nbad = [[0] * 3] * 2                  # the SAME row object repeated twice\nbad[0][1] = 7\nprint(bad)                           # both rows changed\n```\n\nThe first line uses a **comprehension**, which you'll learn properly at the end of this module.\n\n## How fast are list operations?\n\nBig-O notation describes how running time grows with the input size `n`. With hidden tests of 100,000 elements, an O(n) step inside an O(n) loop means about 10¹⁰ operations, which is far too slow.\n\n| Operation | Cost |\n|---|---|\n| `nums[i]`, `nums[i] = x`, `len(nums)` | O(1) |\n| `nums.append(x)`, `nums.pop()` | O(1) |\n| `nums.insert(0, x)`, `nums.pop(0)` | O(n): every item shifts |\n| `x in nums`, `nums.index(x)`, `nums.remove(x)` | O(n): scans the list |\n| `nums[a:b]` | O(b − a): copies |\n| `sorted(nums)`, `nums.sort()` | O(n log n) |\n\n> **Key idea:** appending and indexing are cheap. Searching, inserting at the front, and slicing are not.","minutes":20,"exercises":["running-sum","rotate-right"],"setup":null},{"id":"dictionaries","title":"Dictionaries","summary":"Key-value lookups in O(1): counting, grouping and remembering.","body":"A **dictionary** (`dict`) maps **keys** to **values**. Looking up a key takes O(1) time on average, however big the dictionary is. That makes dicts the most important tool for writing fast algorithms.\n\n```python\nages = {\"ada\": 36, \"alan\": 41}\nages[\"grace\"] = 85            # add or update\nprint(ages[\"ada\"])\nprint(len(ages), \"alan\" in ages, \"linus\" in ages)\ndel ages[\"alan\"]\nprint(ages)\n```\n\n## Safe lookups\n\n`d[key]` raises `KeyError` if the key is missing. `d.get(key, default)` returns the default instead.\n\n```python\nstock = {\"apples\": 3}\nprint(stock.get(\"apples\", 0), stock.get(\"pears\", 0))\n```\n\n## Looping\n\nDicts remember insertion order.\n\n```python\ncapitals = {\"France\": \"Paris\", \"Japan\": \"Tokyo\", \"Kenya\": \"Nairobi\"}\nfor country in capitals:              # loops over keys\n    print(country, end=\" \")\nprint()\nprint(list(capitals.values()))\nfor country, city in capitals.items():\n    print(f\"{city} is the capital of {country}\")\n```\n\n## Counting: the classic dict pattern\n\n```python\ncounts = {}\nfor ch in \"mississippi\":\n    counts[ch] = counts.get(ch, 0) + 1\nprint(counts)\n```\n\nThe `collections` module has shortcuts for counting and grouping:\n\n```python\nfrom collections import Counter, defaultdict\n\nc = Counter(\"mississippi\")\nprint(c)\nprint(c.most_common(2))\nprint(c[\"s\"], c[\"z\"])               # missing keys count as 0\n\ngroups = defaultdict(list)          # missing keys start as an empty list\nfor word in [\"ant\", \"bee\", \"asp\", \"cow\", \"bat\"]:\n    groups[word[0]].append(word)\nprint(dict(groups))\n```\n\n## Remembering what you've seen\n\nA dict can record *where* or *when* you saw each value. That turns a search inside a loop into a single pass:\n\n```python\nnums = [4, 9, 1, 9, 4, 7]\nfirst_seen = {}\nfor i, x in enumerate(nums):\n    if x not in first_seen:\n        first_seen[x] = i\nprint(first_seen)\n```\n\n## Keys must be hashable\n\nKeys must be **immutable**: strings, numbers, booleans, or tuples of those. A list can't be a key (`TypeError: unhashable type: 'list'`), so convert it with `tuple(...)` first. Values can be anything.\n\n```python\nboard = {}\nboard[(0, 0)] = \"X\"          # a tuple key works\nboard[tuple([1, 2])] = \"O\"\nprint(board)\n```\n\n> **Key idea:** whenever you're about to search a list inside a loop, ask whether a dict could answer the question in O(1).","minutes":20,"exercises":["word-count","group-by-length"],"setup":null},{"id":"sets-tuples","title":"Sets & Tuples","summary":"Unique collections with fast membership, and immutable records.","body":"## Tuples\n\nA **tuple** is like a list that can't be changed. Use one for a fixed group of values such as a coordinate, a pair or a record.\n\n```python\npoint = (3, 4)\nx, y = point                 # unpacking\nprint(x, y, point[0], len(point))\nsingle = (5,)                # a one-element tuple needs the trailing comma\nprint(type(single), type((5)))\n```\n\nTuples are hashable, so they can be dict keys and set members. They compare element by element, which is useful for sorting:\n\n```python\ndistances = {(0, 0): 0, (1, 2): 3}\nprint(distances[(1, 2)])\nprint((1, 5) < (2, 0), (1, 5) < (1, 9))\n```\n\n## Sets\n\nA **set** is an unordered collection of **unique** items with O(1) membership tests.\n\n```python\ncolours = {\"red\", \"green\"}\ncolours.add(\"blue\")\ncolours.add(\"red\")            # already present: nothing happens\nprint(len(colours), \"red\" in colours)\ncolours.discard(\"green\")      # remove if present, no error if missing\nprint(sorted(colours))        # sets have no order; sort to display\nprint(set([3, 1, 3, 2, 1]))   # de-duplicate a list\nempty = set()                 # careful: {} is an empty dict\nprint(type(empty), type({}))\n```\n\n## Set algebra\n\n```python\na = {1, 2, 3, 4}\nb = {3, 4, 5}\nprint(a | b)         # union: in either\nprint(a & b)         # intersection: in both\nprint(a - b)         # difference: in a but not b\nprint(a ^ b)         # in exactly one\nprint({1, 2} <= a)   # subset test\n```\n\n## \"Have I seen this before?\"\n\n```python\ndef first_repeat(items):\n    seen = set()\n    for item in items:\n        if item in seen:\n            return item\n        seen.add(item)\n    return None\n\nprint(first_repeat([\"a\", \"b\", \"c\", \"b\", \"a\"]))\nprint(first_repeat([1, 2, 3]))\n```\n\n`item in seen` is O(1) for a set and O(n) for a list. On 100,000 items that's the difference between instant and minutes.\n\n## Which collection should I use?\n\n| You need | Use |\n|---|---|\n| an ordered sequence you can change | `list` |\n| a fixed record, or a compound dict key | `tuple` |\n| fast \"is it in there?\" checks or uniqueness | `set` |\n| to look up a value by a key | `dict` |\n\n> **Key idea:** convert to a set when you only care *whether* something is present, and use tuples when you need a list-like value as a key.","minutes":15,"exercises":["common-elements","unique-points"],"setup":null},{"id":"comprehensions","title":"Comprehensions & Sorting","summary":"Build collections in one expression and sort by any rule.","body":"## List comprehensions\n\nA comprehension builds a list in one expression: `[expression for item in iterable if condition]`.\n\n```python\nsquares = [n * n for n in range(6)]\nevens = [n for n in range(20) if n % 2 == 0]\nlowered = [w.lower() for w in [\"Hello\", \"World\"]]\nprint(squares, evens, lowered)\n```\n\nIt's shorthand for the familiar loop:\n\n```python\nevens = []\nfor n in range(20):\n    if n % 2 == 0:\n        evens.append(n)\nprint(evens)\n```\n\nComprehensions can nest, and the `for` clauses read left to right like nested loops:\n\n```python\npairs = [(x, y) for x in range(3) for y in range(3) if x < y]\nprint(pairs)\ngrid = [[r * 3 + c for c in range(3)] for r in range(3)]\nprint(grid)\nflat = [v for row in grid for v in row]\nprint(flat)\nlabels = [\"even\" if n % 2 == 0 else \"odd\" for n in range(5)]\nprint(labels)\n```\n\n## Dict and set comprehensions\n\n```python\nwords = [\"apple\", \"fig\", \"banana\"]\nlengths = {w: len(w) for w in words}\nfirst_letters = {w[0] for w in words}\nprint(lengths, first_letters)\ninverted = {v: k for k, v in {\"a\": 1, \"b\": 2}.items()}\nprint(inverted)\n```\n\n## Generator expressions\n\nInside a function call you can drop the brackets. Python then streams the values instead of building a list:\n\n```python\nnums = [3, 8, 12, 5]\nprint(sum(n * n for n in nums))\nprint(any(n > 10 for n in nums), all(n > 0 for n in nums))\nprint(max(len(w) for w in [\"a\", \"abc\", \"ab\"]))\n```\n\n## Sorting with a key\n\n`sorted(items, key=f)` compares `f(item)` instead of the item itself.\n\n```python\nwords = [\"banana\", \"Fig\", \"apple\", \"cherry\", \"date\"]\nprint(sorted(words))                  # capital letters sort first\nprint(sorted(words, key=str.lower))\nprint(sorted(words, key=len))\nprint(sorted(words, key=len, reverse=True))\n```\n\nFor several criteria, return a **tuple** from the key. To reverse one numeric criterion, negate it:\n\n```python\npeople = [(\"Ada\", 36), (\"Alan\", 41), (\"Grace\", 36), (\"Bob\", 41)]\nprint(sorted(people, key=lambda p: (p[1], p[0])))    # age, then name\nprint(sorted(people, key=lambda p: (-p[1], p[0])))   # oldest first, then name\n```\n\nPython's sort is **stable**: items with equal keys keep their original order. `min` and `max` accept a `key` too:\n\n```python\nscores = {\"ada\": 91, \"alan\": 78, \"grace\": 99}\nprint(max(scores, key=scores.get))\nprint(min([\"pear\", \"fig\", \"banana\"], key=len))\n```\n\n> **Key idea:** a comprehension replaces a build-a-list loop, and `key=lambda x: (a, b)` sorts by several rules at once.","minutes":20,"exercises":["even-squares","sort-words"],"setup":null}],"challenges":["pair-target-sum","roman-numeral-value","joyful-number","anagram-groups","most-frequent-k"],"challenge_title":"Checkpoint 2 · Data Structures","challenge_blurb":"Hash maps meet strings, sets and sorting. Includes two classic Medium interview questions."},{"id":"patterns","number":3,"title":"Algorithmic Patterns","blurb":"Two pointers, sliding windows, prefix sums and binary search: the patterns behind most array and string problems.","lessons":[{"id":"two-pointers","title":"Two Pointers","summary":"Walk two indexes through the data to replace nested loops.","body":"Many list and string problems can be solved in a single pass by moving **two indexes** through the data instead of trying every pair. That turns O(n²) into O(n).\n\n## Pattern 1: from both ends toward the middle\n\n```python\ndef is_palindrome(s):\n    left, right = 0, len(s) - 1\n    while left < right:\n        if s[left] != s[right]:\n            return False\n        left += 1\n        right -= 1\n    return True\n\nprint(is_palindrome(\"racecar\"), is_palindrome(\"rocket\"))\n```\n\nSwapping the ends and moving inward also reverses a list without making a copy:\n\n```python\nchars = list(\"hello\")\nleft, right = 0, len(chars) - 1\nwhile left < right:\n    chars[left], chars[right] = chars[right], chars[left]\n    left += 1\n    right -= 1\nprint(chars)\n```\n\n## Pair sums in a sorted list\n\nWhen the list is **sorted**, the sum of the two ends tells you which pointer to move:\n\n- sum too small: move `left` right, toward bigger numbers\n- sum too big: move `right` left, toward smaller numbers\n\n```python\ndef find_pair(nums, target):\n    left, right = 0, len(nums) - 1\n    steps = 0\n    while left < right:\n        steps += 1\n        total = nums[left] + nums[right]\n        if total == target:\n            return nums[left], nums[right], f\"{steps} steps\"\n        if total < target:\n            left += 1\n        else:\n            right -= 1\n    return None\n\nprint(find_pair([1, 3, 4, 6, 8, 11, 15], 14))\nprint(find_pair([1, 2, 3], 100))\n```\n\nThis is safe because, when the sum is too small, `nums[left]` can't be part of any answer. Even paired with the largest remaining number it falls short, so we can discard it.\n\n## Pattern 2: a read pointer and a write pointer\n\nWalking a \"read\" index and a \"write\" index in the same direction filters a list **in place** without extra memory.\n\n```python\ndef remove_duplicates_sorted(nums):\n    if not nums:\n        return 0\n    write = 1\n    for read in range(1, len(nums)):\n        if nums[read] != nums[read - 1]:\n            nums[write] = nums[read]\n            write += 1\n    return write\n\ndata = [1, 1, 2, 3, 3, 3, 7]\nk = remove_duplicates_sorted(data)\nprint(k, data[:k])\n\nnums = [0, 1, 0, 3, 12]      # move zeroes to the end, keeping order\nwrite = 0\nfor read in range(len(nums)):\n    if nums[read] != 0:\n        nums[write], nums[read] = nums[read], nums[write]\n        write += 1\nprint(nums)\n```\n\n## Pattern 3: one pointer per list\n\nMerging two sorted lists: compare the fronts and always take the smaller one.\n\n```python\ndef merge_sorted(a, b):\n    i = j = 0\n    out = []\n    while i < len(a) and j < len(b):\n        if a[i] <= b[j]:\n            out.append(a[i])\n            i += 1\n        else:\n            out.append(b[j])\n            j += 1\n    return out + a[i:] + b[j:]\n\nprint(merge_sorted([1, 4, 9], [2, 3, 10, 11]))\n```\n\n## Modifying a list in place\n\nSome problems ask you to **change the input list in place** and return nothing. The judge then checks the list itself. Rebinding the parameter (`nums = ...`) doesn't touch the caller's list. You have to mutate it with index or slice assignment.\n\n```python\ndef double_all(nums):\n    for i in range(len(nums)):\n        nums[i] *= 2\n\ndef broken(nums):\n    nums = [x * 2 for x in nums]   # only rebinds the local name\n\ndata = [1, 2, 3]\ndouble_all(data)\nprint(data)\nbroken(data)\nprint(data)          # unchanged by broken()\n```\n\n> **Key idea:** if brute force checks every pair, see whether sorted order or a read/write split lets two pointers do it in one pass.","minutes":20,"exercises":["reverse-in-place","pair-sum-sorted"],"setup":null},{"id":"sliding-window","title":"Sliding Window","summary":"Track the best contiguous range while scanning once.","body":"A **window** is a contiguous stretch of a list or string, such as `nums[left:right + 1]`. Sliding window problems ask for the best window: the largest sum of `k` elements, the longest substring with some property, and so on.\n\nRecomputing every window from scratch costs O(n·k). **Sliding** the window costs O(n): add the element that enters and remove the one that leaves.\n\n## Fixed-size window\n\n```python\ndef max_sum_of_k(nums, k):\n    window = sum(nums[:k])\n    best = window\n    for right in range(k, len(nums)):\n        window += nums[right]        # element entering\n        window -= nums[right - k]    # element leaving\n        best = max(best, window)\n    return best\n\nprint(max_sum_of_k([2, 1, 5, 1, 3, 2], 3))\n```\n\n```text\n[2 1 5] 1 3 2    sum 8\n 2 [1 5 1] 3 2   sum 7   (+1 −2)\n 2 1 [5 1 3] 2   sum 9   (+3 −1)\n 2 1 5 [1 3 2]   sum 6   (+2 −5)\n```\n\n## Variable-size window\n\nWhen the size isn't fixed, **grow** the window by advancing `right`, and **shrink** it from `left` whenever it breaks the rule. Each index enters once and leaves at most once, so the whole scan is O(n) even with the inner `while`.\n\n```python\ndef longest_with_sum_at_most(nums, limit):\n    left = window = best = 0\n    for right, x in enumerate(nums):\n        window += x\n        while window > limit:          # too big: shrink from the left\n            window -= nums[left]\n            left += 1\n        best = max(best, right - left + 1)\n    return best\n\nprint(longest_with_sum_at_most([3, 1, 2, 1, 1, 4, 1], 5))\n```\n\n## Tracking what's inside with a dict\n\nTo know *what's* in the window (distinct characters, counts), keep a dict updated as elements enter and leave:\n\n```python\ndef longest_with_k_distinct(s, k):\n    counts = {}\n    left = best = 0\n    for right, ch in enumerate(s):\n        counts[ch] = counts.get(ch, 0) + 1\n        while len(counts) > k:\n            gone = s[left]\n            counts[gone] -= 1\n            if counts[gone] == 0:\n                del counts[gone]\n            left += 1\n        best = max(best, right - left + 1)\n    return best\n\nprint(longest_with_k_distinct(\"eceba\", 2))   # \"ece\"\nprint(longest_with_k_distinct(\"aabbcc\", 1))\n```\n\n## The template\n\n```text\nleft = 0\nfor right in range(len(data)):\n    add data[right] to the window\n    while the window breaks the rule:\n        remove data[left] from the window\n        left += 1\n    update the answer using the window data[left : right + 1]\n```\n\n> **Key idea:** a problem about a *contiguous* subarray or substring that asks for the longest, shortest or best one is usually a sliding window.","minutes":25,"exercises":["max-window-sum","shortest-subarray"],"setup":null},{"id":"prefix-sums","title":"Prefix Sums","summary":"Precompute running totals so every range sum is O(1).","body":"A **prefix sum** list stores running totals: `prefix[i]` is the sum of the first `i` elements. Building it takes O(n). After that, the sum of any range is one subtraction, which is O(1).\n\n```python\nfrom itertools import accumulate\n\nnums = [3, 1, 4, 1, 5, 9, 2]\nprefix = [0]\nfor x in nums:\n    prefix.append(prefix[-1] + x)\nprint(prefix)\n\n# sum of nums[i..j] (inclusive) = prefix[j + 1] - prefix[i]\ni, j = 2, 5\nprint(sum(nums[i:j + 1]), prefix[j + 1] - prefix[i])\n\nprint(list(accumulate(nums, initial=0)))    # the same, built in\n```\n\nStarting with `prefix[0] = 0`, one element longer than `nums`, removes the special case for ranges that begin at index 0.\n\n```text\nnums     =    3  1  4  1   5   9   2\nprefix   = 0  3  4  8  9  14  23  25\nsum(nums[2..5]) = prefix[6] - prefix[2] = 23 - 4 = 19\n```\n\nAnswering `q` range questions directly costs O(n·q). With a prefix list it's O(n + q).\n\n## Left side vs right side\n\nA running total plus the overall total tells you the sums on both sides of any position in one pass:\n\n```python\nnums = [2, 3, -1, 8, 4]\ntotal = sum(nums)\nleft = 0\nfor i, x in enumerate(nums):\n    right = total - left - x\n    print(f\"index {i}: left sum {left}, right sum {right}\")\n    left += x\n```\n\n## Prefix sums + a set: finding a range with a given total\n\nIf the same running total appears twice, the elements between those two points must sum to **zero**. More generally, the range between two prefixes sums to `current - earlier`. Remembering earlier prefixes in a set or dict lets you find such ranges in a single pass:\n\n```python\ndef has_zero_sum_range(nums):\n    seen = {0}\n    running = 0\n    for x in nums:\n        running += x\n        if running in seen:\n            return True\n        seen.add(running)\n    return False\n\nprint(has_zero_sum_range([4, 2, -3, 1, 6]))   # 2 + (-3) + 1 = 0\nprint(has_zero_sum_range([1, 2, 3]))\n```\n\nThis works with negative numbers, unlike a sliding window, which needs every value positive so that growing the window always increases the sum.\n\n> **Key idea:** pay O(n) once for running totals and every range sum becomes O(1). Store earlier prefixes in a set or dict to find ranges with a particular total.","minutes":20,"exercises":["range-sums","balance-index"],"setup":null},{"id":"binary-search","title":"Binary Search","summary":"Halve the search space each step: O(log n).","body":"**Binary search** finds a target in a *sorted* list by repeatedly halving the range that could contain it. Each step throws away half the candidates, so a million items need only about 20 steps. That's O(log n).\n\n```python\ndef binary_search(nums, target):\n    lo, hi = 0, len(nums) - 1\n    while lo <= hi:\n        mid = (lo + hi) // 2\n        if nums[mid] == target:\n            return mid\n        if nums[mid] < target:\n            lo = mid + 1         # target can only be to the right\n        else:\n            hi = mid - 1         # target can only be to the left\n    return -1\n\ndata = [2, 5, 8, 12, 16, 23, 38, 56, 72, 91]\nprint(binary_search(data, 23), binary_search(data, 7))\n```\n\n```text\ntarget 23 in [2 5 8 12 16 23 38 56 72 91]\nlo=0 hi=9 mid=4 → 16 < 23, go right\nlo=5 hi=9 mid=7 → 56 > 23, go left\nlo=5 hi=6 mid=5 → 23 found at index 5\n```\n\n## Finding a boundary\n\nOften you want the **first position** where something becomes true, for example the first index with `nums[i] >= target`. That is also where `target` would be inserted to keep the list sorted.\n\n```python\ndef lower_bound(nums, target):\n    lo, hi = 0, len(nums)        # hi = len(nums) means \"insert at the end\"\n    while lo < hi:\n        mid = (lo + hi) // 2\n        if nums[mid] < target:\n            lo = mid + 1\n        else:\n            hi = mid             # mid might be the answer, so keep it\n    return lo\n\ndata = [1, 3, 3, 3, 5, 8]\nprint(lower_bound(data, 3), lower_bound(data, 4), lower_bound(data, 100))\n```\n\nThe `bisect` module has these built in:\n\n```python\nfrom bisect import bisect_left, bisect_right, insort\n\ndata = [1, 3, 3, 3, 5, 8]\nprint(bisect_left(data, 3))    # first index with value >= 3\nprint(bisect_right(data, 3))   # first index with value > 3\nprint(bisect_right(data, 3) - bisect_left(data, 3), \"copies of 3\")\ninsort(data, 4)                # insert and keep it sorted\nprint(data)\n```\n\n## Binary search on the answer\n\nBinary search works on any **yes/no question whose answer flips once**, not just lists. If \"is `x` big enough?\" goes no, no, no, yes, yes as `x` grows, you can binary search for the first yes.\n\n```python\ndef cube_root_ceil(n):\n    lo, hi = 0, n\n    while lo < hi:\n        mid = (lo + hi) // 2\n        if mid ** 3 >= n:\n            hi = mid\n        else:\n            lo = mid + 1\n    return lo\n\nprint(cube_root_ceil(27), cube_root_ceil(28), cube_root_ceil(10 ** 18))\n```\n\n## Avoiding off-by-one bugs\n\n- Decide whether `hi` is inclusive or exclusive and keep it consistent.\n- Every iteration must shrink the range, or the loop never ends. With `while lo < hi`, write `lo = mid + 1`, never `lo = mid`.\n- Test lists of length 0, 1 and 2, and targets smaller and larger than everything.\n\n> **Key idea:** sorted data, or a yes/no question that flips exactly once, means binary search in O(log n).","minutes":25,"exercises":["insert-positions","integer-sqrt"],"setup":null}],"challenges":["longest-unique-run","subarrays-summing-to-k","zero-sum-triplets","rotated-search","rainwater-between-walls"],"challenge_title":"Checkpoint 3 · Patterns","challenge_blurb":"Interview-grade Medium problems plus your first Hard. Each one needs a pattern and a data structure together."},{"id":"stacks-recursion","number":4,"title":"Stacks, Queues & Recursion","blurb":"Process things in the right order with stacks and queues, and break problems into smaller copies of themselves.","lessons":[{"id":"stacks","title":"Stacks","summary":"Last in, first out: undo, matching pairs and monotonic stacks.","body":"A **stack** is last-in, first-out (LIFO), like a pile of plates: you only ever touch the top. A Python list makes a perfect stack. `append` pushes, `pop` removes the top, and `stack[-1]` peeks, all in O(1).\n\n```python\nstack = []\nstack.append(\"a\")\nstack.append(\"b\")\nstack.append(\"c\")\nprint(stack, \"top:\", stack[-1])\nprint(stack.pop(), stack.pop())\nprint(stack, \"empty?\", not stack)\n```\n\nReach for a stack when the **most recent unfinished thing must be handled first**: undo history, the browser's back button, nested structures, and the function call stack itself.\n\n## Undo and backspace\n\n```python\ndef apply_edits(keys):\n    stack = []\n    for ch in keys:\n        if ch == \"#\":             # '#' means backspace\n            if stack:\n                stack.pop()\n        else:\n            stack.append(ch)\n    return \"\".join(stack)\n\nprint(apply_edits(\"ab#c##d\"))\n```\n\n## Matching pairs\n\nEach opener waits on the stack until its closer arrives, and the closer must match the **most recent** unmatched opener.\n\n```python\ndef tags_balanced(tags):\n    stack = []\n    for tag in tags:\n        if not tag.startswith(\"/\"):\n            stack.append(tag)\n        elif not stack or stack.pop() != tag[1:]:\n            return False\n    return not stack              # anything left open is an error too\n\nprint(tags_balanced([\"html\", \"body\", \"/body\", \"/html\"]))\nprint(tags_balanced([\"b\", \"i\", \"/b\", \"/i\"]))\n```\n\n## Evaluating expressions\n\nIn postfix notation, `3 4 + 2 *` means `(3 + 4) * 2`. Numbers are pushed. An operator pops two values and pushes the result.\n\n```python\ndef eval_postfix(tokens):\n    stack = []\n    for tok in tokens:\n        if tok in (\"+\", \"-\", \"*\"):\n            b = stack.pop()\n            a = stack.pop()\n            if tok == \"+\":\n                stack.append(a + b)\n            elif tok == \"-\":\n                stack.append(a - b)\n            else:\n                stack.append(a * b)\n        else:\n            stack.append(int(tok))\n    return stack[0]\n\nprint(eval_postfix(\"3 4 + 2 *\".split()))\nprint(eval_postfix(\"5 1 2 + 4 * + 3 -\".split()))\n```\n\n## Monotonic stacks\n\nA **monotonic stack** keeps its contents in sorted order by popping anything that would break the order before pushing. It answers \"what's the nearest bigger (or smaller) element?\" for **every** position in O(n) total.\n\n```python\ndef previous_smaller(nums):\n    result = []\n    stack = []          # increasing from bottom to top\n    for x in nums:\n        while stack and stack[-1] >= x:\n            stack.pop()    # can never be the answer for anything after x\n        result.append(stack[-1] if stack else None)\n        stack.append(x)\n    return result\n\nprint(previous_smaller([4, 10, 5, 8, 20, 15, 3, 12]))\n```\n\nIt looks like a nested loop, but each value is pushed once and popped at most once, so the total work is O(n).\n\n> **Key idea:** a stack holds unfinished business in reverse order. A monotonic stack finds the next or previous greater or smaller element in O(n).","minutes":20,"exercises":["remove-adjacent-pairs","next-greater"],"setup":null},{"id":"queues-bfs","title":"Queues & Breadth-First Search","summary":"First in, first out with deque, and exploring graphs layer by layer.","body":"A **queue** is first-in, first-out (FIFO), like a line at a shop. Use `collections.deque`: `append` adds to the back and `popleft` removes from the front, both O(1). A list's `pop(0)` is O(n) because every other item shifts along.\n\n```python\nfrom collections import deque\n\nqueue = deque()\nqueue.append(\"first\")\nqueue.append(\"second\")\nqueue.append(\"third\")\nprint(queue.popleft(), queue.popleft())\nprint(queue, len(queue))\n\nd = deque([1, 2, 3, 4, 5])\nd.appendleft(0)\nd.rotate(2)            # move the last 2 items to the front\nprint(d)\nd.rotate(-3)           # move the first 3 items to the back\nprint(d)\n```\n\n## Simulating a line\n\nRound-robin scheduling: each task gets up to 2 units of work, then goes to the back of the line.\n\n```python\nfrom collections import deque\n\ntasks = deque([(\"A\", 3), (\"B\", 5), (\"C\", 1)])\ntime = 0\nwhile tasks:\n    name, remaining = tasks.popleft()\n    work = min(2, remaining)\n    time += work\n    if remaining > work:\n        tasks.append((name, remaining - work))\n    else:\n        print(f\"{name} finished at t={time}\")\n```\n\n## Breadth-first search (BFS)\n\nBFS explores outward from a start in **layers**: everything 1 step away, then everything 2 steps away, and so on. A queue enforces that order, and a `visited` set prevents going round in circles. Because layers are processed in order, **the first time BFS reaches something is along a shortest path**, as long as every step costs the same.\n\n```python\nfrom collections import deque\n\nfriends = {\n    \"ana\": [\"ben\", \"cai\"],\n    \"ben\": [\"ana\", \"dev\"],\n    \"cai\": [\"ana\", \"dev\"],\n    \"dev\": [\"ben\", \"cai\", \"eli\"],\n    \"eli\": [\"dev\"],\n}\n\ndef degrees_apart(graph, start, goal):\n    queue = deque([(start, 0)])\n    visited = {start}\n    while queue:\n        person, dist = queue.popleft()\n        if person == goal:\n            return dist\n        for friend in graph[person]:\n            if friend not in visited:\n                visited.add(friend)\n                queue.append((friend, dist + 1))\n    return -1\n\nprint(degrees_apart(friends, \"ana\", \"eli\"))\n```\n\n## BFS on a grid\n\nA grid is a graph in disguise: each cell's neighbours are the cells above, below, left and right. A list of direction offsets keeps the code tidy.\n\n```python\nfrom collections import deque\n\ngrid = [\"S.#.\",\n        \"..#.\",\n        \"...E\"]\nrows, cols = len(grid), len(grid[0])\nDIRECTIONS = [(1, 0), (-1, 0), (0, 1), (0, -1)]\n\nqueue = deque([(0, 0, 0)])        # row, col, distance\nseen = {(0, 0)}\nwhile queue:\n    r, c, d = queue.popleft()\n    if grid[r][c] == \"E\":\n        print(\"reached E in\", d, \"steps\")\n        break\n    for dr, dc in DIRECTIONS:\n        nr, nc = r + dr, c + dc\n        if 0 <= nr < rows and 0 <= nc < cols and grid[nr][nc] != \"#\" and (nr, nc) not in seen:\n            seen.add((nr, nc))\n            queue.append((nr, nc, d + 1))\n```\n\nMark a cell as visited **when you add it to the queue**, not when you pop it. Otherwise the same cell can be queued many times.\n\n## Several starting points at once\n\nTo measure distance from the *nearest* of several sources, put **all** of them in the queue at distance 0 before you begin. This is called multi-source BFS. The layers then spread from every source simultaneously.\n\n```python\nfrom collections import deque\n\nline = [0, 0, 1, 0, 0, 0, 1, 0]          # 1 = a shop\ndist = [None] * len(line)\nqueue = deque()\nfor i, x in enumerate(line):\n    if x == 1:\n        dist[i] = 0\n        queue.append(i)\nwhile queue:\n    i = queue.popleft()\n    for j in (i - 1, i + 1):\n        if 0 <= j < len(line) and dist[j] is None:\n            dist[j] = dist[i] + 1\n            queue.append(j)\nprint(dist)                               # distance to the nearest shop\n```\n\n> **Key idea:** use `deque` for queues. BFS is a queue plus a visited set, and it finds shortest paths in unweighted graphs and grids.","minutes":25,"exercises":["last-player","minutes-to-spread"],"setup":null},{"id":"recursion","title":"Recursion & Backtracking","summary":"Solve problems in terms of smaller copies of themselves.","body":"A **recursive** function calls itself on a smaller version of the same problem. Every recursive function needs:\n\n1. a **base case** that is answered directly, and\n2. a **recursive case** that moves toward the base case.\n\n```python\ndef factorial(n):\n    if n <= 1:                    # base case\n        return 1\n    return n * factorial(n - 1)   # smaller problem\n\nprint(factorial(5))\n```\n\n## Trust the recursion\n\nAssume the recursive call already works for the smaller input, and think only about how to use its answer.\n\n```python\ndef total(nums):\n    if not nums:\n        return 0\n    return nums[0] + total(nums[1:])\n\ndef count_down(n):\n    if n == 0:\n        print(\"liftoff!\")\n        return\n    print(n, end=\" \")\n    count_down(n - 1)\n\nprint(total([4, 8, 15, 16, 23, 42]))\ncount_down(5)\n```\n\n## The call stack\n\nEach call waits for the call it made to finish, and Python stacks them up. By default Python stops at around 1000 nested calls with a `RecursionError`. For very deep problems, a loop with your own stack or queue is safer.\n\n```python\ndef depth(n):\n    if n == 0:\n        return 0\n    return 1 + depth(n - 1)\n\nprint(depth(500))\n```\n\n## Halving the problem\n\nFast exponentiation halves the exponent at each step, using `xⁿ = (x^(n/2))²`. That makes about log₂(n) calls instead of n.\n\n```python\ndef power(x, n):\n    if n == 0:\n        return 1\n    half = power(x, n // 2)\n    return half * half if n % 2 == 0 else half * half * x\n\nprint(power(2, 10), power(3, 13))\n```\n\n## Nested data\n\nRecursion fits naturally when data contains smaller copies of itself:\n\n```python\ndef deep_sum(item):\n    if isinstance(item, int):\n        return item\n    return sum(deep_sum(x) for x in item)\n\nprint(deep_sum([1, [2, [3, 4]], [[5]]]))\n```\n\n## Backtracking\n\n**Backtracking** builds a candidate solution one choice at a time and **undoes** each choice after exploring it, so it systematically tries every possibility.\n\n```text\ndef backtrack(partial):\n    if partial is complete:\n        record a copy of it\n        return\n    for each available choice:\n        make the choice          # e.g. current.append(x)\n        backtrack(partial)       # explore\n        undo the choice          # current.pop()\n```\n\nEvery ordering of some letters (permutations):\n\n```python\ndef orderings(letters):\n    results, current = [], []\n    used = [False] * len(letters)\n\n    def backtrack():\n        if len(current) == len(letters):\n            results.append(\"\".join(current))\n            return\n        for i, ch in enumerate(letters):\n            if not used[i]:\n                used[i] = True\n                current.append(ch)\n                backtrack()\n                current.pop()\n                used[i] = False\n\n    backtrack()\n    return results\n\nprint(orderings(\"abc\"))\n```\n\nChoosing `k` items (combinations). Each call only picks from index `start` onward, so items stay in order and no combination repeats:\n\n```python\ndef choose(items, k):\n    results = []\n\n    def backtrack(start, current):\n        if len(current) == k:\n            results.append(current[:])     # copy, because current keeps changing\n            return\n        for i in range(start, len(items)):\n            current.append(items[i])\n            backtrack(i + 1, current)\n            current.pop()\n\n    backtrack(0, [])\n    return results\n\nprint(choose([1, 2, 3, 4], 2))\n```\n\n`results.append(current[:])` stores a **copy**. Appending `current` itself would store the same list object many times, and it's empty by the end.\n\n**Pruning** means abandoning a branch as soon as it can't lead to a valid answer. It's what makes backtracking fast enough in practice.\n\n> **Key idea:** recursion is a base case plus a call on a smaller input. Backtracking is choose, explore, un-choose.","minutes":30,"exercises":["flatten","no-adjacent-ones"],"setup":null}],"challenges":["balanced-brackets","warmer-days-ahead","every-subset","island-count","bracket-builder"],"challenge_title":"Checkpoint 4 · Stacks & Recursion","challenge_blurb":"Stacks, BFS on grids and backtracking, each paired with hash maps, strings or lists."},{"id":"linked-structures","number":5,"title":"Objects, Linked Lists & Trees","blurb":"Design your own classes and work with node-based structures: linked lists and binary trees.","lessons":[{"id":"classes","title":"Classes & Objects","summary":"Bundle data with the methods that use it, and design your own types.","body":"A **class** bundles data (attributes) with the functions that act on it (methods). Each object made from a class is an **instance** with its own data.\n\n```python\nclass Counter:\n    def __init__(self, start=0):     # runs when you create an instance\n        self.value = start           # self is the instance being set up\n\n    def increment(self, by=1):\n        self.value += by\n        return self.value\n\na = Counter()\nb = Counter(10)\na.increment()\na.increment()\nb.increment(5)\nprint(a.value, b.value)\n```\n\n`self` is how a method refers to its own instance. Writing `a.increment()` really means `Counter.increment(a)`.\n\n## Printing objects nicely\n\nDefine `__repr__` to control how an object is displayed:\n\n```python\nclass Point:\n    def __init__(self, x, y):\n        self.x = x\n        self.y = y\n\n    def __repr__(self):\n        return f\"Point({self.x}, {self.y})\"\n\n    def distance_to(self, other):\n        return ((self.x - other.x) ** 2 + (self.y - other.y) ** 2) ** 0.5\n\np, q = Point(0, 0), Point(3, 4)\nprint(p, q, p.distance_to(q))\n```\n\n## Special methods\n\nMethods with double underscores (\"dunder\" methods) let your objects work with Python's built-in syntax:\n\n```python\nclass Playlist:\n    def __init__(self, songs):\n        self.songs = list(songs)\n\n    def __len__(self):\n        return len(self.songs)\n\n    def __contains__(self, song):\n        return song in self.songs\n\n    def __eq__(self, other):\n        return isinstance(other, Playlist) and self.songs == other.songs\n\nmix = Playlist([\"Intro\", \"Anthem\"])\nprint(len(mix), \"Anthem\" in mix, mix == Playlist([\"Intro\", \"Anthem\"]))\n```\n\n## Class attributes vs instance attributes\n\n```python\nclass Dog:\n    species = \"Canis familiaris\"      # shared by every Dog\n\n    def __init__(self, name):\n        self.name = name              # different for each Dog\n\nrex, fido = Dog(\"Rex\"), Dog(\"Fido\")\nprint(rex.species, fido.species, rex.name, fido.name)\n```\n\n## Objects that wrap data structures\n\nMost **design** problems are a class that wraps a list, dict or deque, with methods that keep it consistent:\n\n```python\nfrom collections import deque\n\nclass RecentHistory:\n    def __init__(self, capacity):\n        self.capacity = capacity\n        self.items = deque()\n\n    def visit(self, page):\n        self.items.append(page)\n        if len(self.items) > self.capacity:\n            self.items.popleft()\n\n    def recent(self):\n        return list(self.items)\n\nh = RecentHistory(3)\nfor page in [\"home\", \"news\", \"sport\", \"weather\"]:\n    h.visit(page)\nprint(h.recent())\n```\n\n## How design problems are tested\n\nLeetCode-style design problems test your class with two lists: the **operations** to call and their **arguments**. The first operation creates the object.\n\n```text\noperations = [\"RecentHistory\", \"visit\", \"visit\", \"recent\"]\narguments  = [[2],             [\"a\"],   [\"b\"],   []       ]\noutput     = [None,            None,    None,    [\"a\", \"b\"]]\n```\n\nThat runs `h = RecentHistory(2)`, `h.visit(\"a\")`, `h.visit(\"b\")`, `h.recent()` and compares every return value. Methods that return nothing produce `None`.\n\n## Inheritance\n\nA class can extend another, reusing its methods and overriding the ones that differ:\n\n```python\nclass Shape:\n    def area(self):\n        return 0\n\n    def describe(self):\n        return f\"{type(self).__name__} with area {self.area():.1f}\"\n\nclass Circle(Shape):\n    def __init__(self, r):\n        self.r = r\n\n    def area(self):\n        return 3.14159 * self.r ** 2\n\nclass Square(Shape):\n    def __init__(self, side):\n        self.side = side\n\n    def area(self):\n        return self.side ** 2\n\nfor shape in [Circle(1), Square(3)]:\n    print(shape.describe())\n```\n\n> **Key idea:** a class keeps data and the operations on it together. `__init__` sets up the state, and methods read and update it through `self`.","minutes":25,"exercises":["bank-account","moving-average"],"setup":null},{"id":"linked-lists","title":"Linked Lists","summary":"Chains of nodes: traversal, dummy heads and fast/slow pointers.","body":"A **linked list** is a chain of nodes. Each node holds a value and a reference to the next node, and the last node points to `None`. You can only reach a node by following the chain from the **head**.\n\n```python\nclass ListNode:\n    def __init__(self, val=0, next=None):\n        self.val = val\n        self.next = next\n\nhead = ListNode(1, ListNode(2, ListNode(3)))       # 1 -> 2 -> 3\nprint(head.val, head.next.val, head.next.next.val)\nprint(head.next.next.next)                         # the end\n```\n\nIn exercises, `ListNode` is already defined for you, as on LeetCode. Test cases write a linked list as a Python list: `[1, 2, 3]` means `1 -> 2 -> 3`, and `[]` means an empty list (`None`).\n\nEvery example in this lesson also has two helpers ready: `from_list(values)` builds a linked list and `to_list(head)` reads one back.\n\n## Walking the chain\n\n```python\ndef length(head):\n    count = 0\n    node = head\n    while node:              # stops after the last node\n        count += 1\n        node = node.next\n    return count\n\nhead = from_list([4, 8, 15, 16, 23])\nprint(length(head), to_list(head))\n```\n\n## Linked lists vs Python lists\n\n| Operation | Python list | Linked list |\n|---|---|---|\n| read the i-th item | O(1) | O(n): walk there |\n| insert or delete at the front | O(n) | O(1) |\n| insert or delete after a node you hold | O(n) | O(1) |\n\n## Inserting and deleting\n\nChanging a linked list means **re-pointing `next` references**. Draw boxes and arrows when in doubt.\n\n```python\nhead = from_list([1, 2, 4])\ntwo = head.next\ntwo.next = ListNode(3, two.next)      # insert 3 after 2\nprint(to_list(head))\n\nhead.next = head.next.next            # unlink the node after head\nprint(to_list(head))\n```\n\n## The dummy node trick\n\nDeleting the head is usually a special case, because the head has no node before it. Put a **dummy** node in front and every real node has a predecessor:\n\n```python\ndef remove_all(head, target):\n    dummy = ListNode(0, head)\n    prev = dummy\n    while prev.next:\n        if prev.next.val == target:\n            prev.next = prev.next.next    # skip over it\n        else:\n            prev = prev.next\n    return dummy.next                     # the (possibly new) head\n\nprint(to_list(remove_all(from_list([7, 7, 1, 7, 2]), 7)))\n```\n\n## Fast and slow pointers\n\nMove one pointer 1 step at a time and another 2 steps. On a list with a **cycle**, the fast pointer eventually laps the slow one. Otherwise it falls off the end.\n\n```python\ndef has_cycle(head):\n    slow = fast = head\n    while fast and fast.next:\n        slow = slow.next\n        fast = fast.next.next\n        if slow is fast:\n            return True\n    return False\n\na = from_list([1, 2, 3, 4])\nprint(has_cycle(a))\na.next.next.next.next = a.next        # point 4 back at 2\nprint(has_cycle(a))\n```\n\nWhen the fast pointer reaches the end, the slow pointer has gone half as far, which is handy for finding the middle.\n\n## Before you re-point, save\n\nOverwriting `node.next` loses the rest of the chain unless you saved it first. Reversing a list (the first problem in this module's checkpoint) keeps three variables for exactly this reason: the previous node, the current node, and the saved next node.\n\n> **Key idea:** save `node.next` before you overwrite it, use a dummy node to avoid special cases at the head, and use fast/slow pointers to find middles and cycles.","minutes":25,"exercises":["middle-node","dedupe-sorted-list"],"setup":"def from_list(values):\n    dummy = tail = ListNode()\n    for v in values:\n        tail.next = ListNode(v)\n        tail = tail.next\n    return dummy.next\n\ndef to_list(head):\n    out = []\n    while head:\n        out.append(head.val)\n        head = head.next\n    return out\n"},{"id":"binary-trees","title":"Binary Trees","summary":"Recursive structures: depth-first and breadth-first traversal, BSTs.","body":"A **binary tree** is made of nodes that each hold a value and up to two children, `left` and `right`. The top node is the **root**. Nodes with no children are **leaves**.\n\n```text\n        3          ← root\n       / \\\n      9   20\n         /  \\\n        15   7     ← leaves: 9, 15 and 7\n```\n\n```python\nroot = TreeNode(3, TreeNode(9), TreeNode(20, TreeNode(15), TreeNode(7)))\nprint(root.val, root.left.val, root.right.left.val)\nprint(root.left.left)        # a missing child is None\n```\n\nTest cases write trees in **level order**: top to bottom, left to right, with `None` for missing children. The tree above is `[3, 9, 20, None, None, 15, 7]`. In this lesson's examples, `build_tree(values)` turns such a list into nodes for you.\n\n## Recursion is natural for trees\n\nEvery subtree is itself a tree, so most tree functions follow one shape: handle the empty tree (`None`), then combine the answers from the left and right subtrees.\n\n```python\ndef count_nodes(node):\n    if node is None:\n        return 0\n    return 1 + count_nodes(node.left) + count_nodes(node.right)\n\ndef height(node):\n    if node is None:\n        return 0\n    return 1 + max(height(node.left), height(node.right))\n\nroot = build_tree([3, 9, 20, None, None, 15, 7])\nprint(count_nodes(root), height(root))\n```\n\n## Depth-first traversals\n\nThe three classic orders differ only in **when** you record the current node:\n\n- **preorder**: the node, then its left subtree, then its right subtree\n- **inorder**: left subtree, then the node, then right subtree\n- **postorder**: left subtree, right subtree, then the node\n\n```python\ndef preorder(node, out):\n    if node is None:\n        return out\n    out.append(node.val)        # record before visiting the children\n    preorder(node.left, out)\n    preorder(node.right, out)\n    return out\n\nroot = build_tree([1, 2, 3, 4, 5, None, 6])\nprint(preorder(root, []))\n```\n\n## Breadth-first: level by level\n\nBFS with a queue visits the tree one level at a time:\n\n```python\nfrom collections import deque\n\ndef bfs_values(root):\n    if root is None:\n        return []\n    out = []\n    queue = deque([root])\n    while queue:\n        node = queue.popleft()\n        out.append(node.val)\n        if node.left:\n            queue.append(node.left)\n        if node.right:\n            queue.append(node.right)\n    return out\n\nprint(bfs_values(build_tree([1, 2, 3, 4, 5, None, 6])))\n```\n\n## Binary search trees\n\nIn a **binary search tree** (BST), every value in a node's left subtree is smaller than the node's value, and every value in its right subtree is larger. A search discards one whole side at each step, like binary search.\n\n```python\ndef bst_insert(node, val):\n    if node is None:\n        return TreeNode(val)\n    if val < node.val:\n        node.left = bst_insert(node.left, val)\n    else:\n        node.right = bst_insert(node.right, val)\n    return node\n\ndef bst_contains(node, val):\n    while node:\n        if val == node.val:\n            return True\n        node = node.left if val < node.val else node.right\n    return False\n\nbst = None\nfor v in [8, 3, 10, 1, 6, 14]:\n    bst = bst_insert(bst, v)\nprint(bst_contains(bst, 6), bst_contains(bst, 7))\n```\n\nA balanced BST has height about log₂(n), so searches are O(log n). If values arrive already sorted, the tree becomes a long chain and searches degrade to O(n).\n\n> **Key idea:** most tree problems are \"answer for `None`, then combine the left and right answers\". Use a queue when the problem is about levels.","minutes":30,"exercises":["count-leaves","inorder-traversal"],"setup":"def build_tree(values):\n    if not values or values[0] is None:\n        return None\n    root = TreeNode(values[0])\n    queue = deque([root])\n    i = 1\n    while queue and i < len(values):\n        node = queue.popleft()\n        if i < len(values) and values[i] is not None:\n            node.left = TreeNode(values[i])\n            queue.append(node.left)\n        i += 1\n        if i < len(values) and values[i] is not None:\n            node.right = TreeNode(values[i])\n            queue.append(node.right)\n        i += 1\n    return root\n"}],"challenges":["reverse-chain","merge-sorted-chains","mirror-tree","level-by-level","min-stack","lru-cache"],"challenge_title":"Checkpoint 5 · Linked Structures","challenge_blurb":"Pointer manipulation, tree recursion and BFS, plus two classic design questions that combine classes with hash maps."},{"id":"heaps-dp","number":6,"title":"Heaps & Dynamic Programming","blurb":"Priority queues for always-the-best-next problems, and dynamic programming for problems built from overlapping subproblems.","lessons":[{"id":"heaps","title":"Heaps & Priority Queues","summary":"Always get the smallest (or largest) item fast with heapq.","body":"A **heap** gives you its smallest item in O(1) and lets you add or remove items in O(log n). It's the data structure behind **priority queues**, which always serve the most urgent item next. Python's `heapq` module maintains a plain list as a **min-heap**.\n\n```python\nimport heapq\n\nheap = []\nfor x in [5, 1, 8, 3, 9, 2]:\n    heapq.heappush(heap, x)\nprint(heap[0])                    # the smallest is always at index 0\nprint(heapq.heappop(heap), heapq.heappop(heap), heapq.heappop(heap))\nprint(heap)                       #
